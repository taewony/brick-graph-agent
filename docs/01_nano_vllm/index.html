    "body": "# Distributed Serving (분산 서빙)\n\n## 📌 개요\n\nModule 6까지 우리는 **단일 GPU** 환경에서 최적의 KV Cache 관리(PagedAttention), 메모리 풀 운영(Block Manager), 그리고 프리픽스 캐싱(Prefix Caching)까지 구축했습니다.\n\nModule 7은 이 모든 인프라를 **다중 GPU 및 다중 노드** 환경으로 확장합니다. **Tensor Parallelism(텐서 병렬성)** 을 통해 모델 가중치를 여러 GPU에 분할(Shard)하여 단일 GPU 메모리 한계를 극복하고, **NCCL**을 통한 고속 GPU 간 통신으로 분산 연산을 동기화합니다.\n\n### Module 7의 핵심 가치\n\n| 측면 | 설명 |\n|---|---|\n| **모델 확장성** | 단일 GPU에 적재할 수 없는 대형 모델(70B+)을 여러 GPU에 분산 배치 |\n| **처리량 향상** | Tensor Parallelism으로 연산을 분산하여 Prefill/Decode 처리량 증가 |\n| **메모리 용량 확장** | GPU 수에 비례하여 KV Cache 용량 증가 (단일 GPU 대비 N배) |\n| **Multi-Node 지원** | 단일 노드(Single-Node)를 넘어 다중 노드(Multi-Node)로 확장 가능 |\n\n> 💡 **실제 사례**: Llama 3 70B 모델(140GB)은 단일 A100 80GB에 적재할 수 없습니다. Tensor Parallelism(TP=4)로 4개의 A100에 모델을 분할하면, 각 GPU는 약 35GB의 가중치를 담당하게 되어 **KV Cache를 위한 여유 메모리**까지 확보할 수 있습니다.\n\n---\n\n## 🧩 포함 원자적 개념\n\n- [`atomic.tensor_parallelism`](../03_atomic/tensor_parallelism.md) — 모델 가중치를 GPU 수에 따라 분할(Shard)하는 병렬화 전략\n- [`atomic.master_worker`](../03_atomic/master_worker.md) — Rank 0(Master)가 워커들을 조정하는 Master-Worker 실행 패턴\n- [`atomic.nccl_communicator`](../03_atomic/nccl_communicator.md) — NCCL 백엔드를 통한 GPU 간 All-Reduce 등 집단 통신(Collective Communication)\n- [`atomic.shared_memory_ipc`](../03_atomic/shared_memory_ipc.md) — Master가 워커에게 명령과 데이터를 브로드캐스트하는 공유 메모리 IPC 채널\n- `atomic.distributed_kv_cache` — 분산 환경에서 각 GPU가 자신이 담당하는 KV Cache 블록을 관리\n\n## 🏗️ 복합 개념 (Composite Concept)\n\n- `composite.distributed_executor` — ModelRunner, NCCL Process Group, Shared Memory를 통합한 분산 실행 엔진\n\n## 🔗 관련 관계\n\n- **PREREQUISITES**: [`block_manager`](../02_composite/block_manager.md), [`paged_attention_manager`](../02_composite/paged_attention_manager.md), [`composite.prefix_cache_manager`](../02_composite/caching_strategy.md)\n- **COMPOSES_INTO**: [`serving_system`](../02_composite/serving_system.md) (전체 vLLM 시스템의 최상위 완성)\n\n---\n\n## 🧱 1. 분산 실행 아키텍처 (Distributed Execution Architecture)\n\n### 1.1 Multi-Process 아키텍처\n\nnano-vLLM은 **Multi-Process 분산 아키텍처**를 사용하여 모델 연산을 여러 GPU에 분할합니다.\n\n```\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                         LLMEngine (Main Process)                           │\n│  - 요청 수신 및 토큰화                                                     │\n│  - Scheduler를 통한 배치 구성                                               │\n│  - ModelRunner에 실행 명령 전달                                              │\n└─────────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼ (spawn)\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                    Distributed Execution Layer                             │\n│  ┌─────────────────────────────────────────────────────────────────────┐   │\n│  │  Master Process (Rank 0)  │  Worker Process (Rank 1) │  Worker ... │   │\n│  │  - GPU 0                  │  - GPU 1                 │  - GPU N-1   │   │\n│  │  - 모델 가중치 Shard 0     │  - 모델 가중치 Shard 1    │  - Shard N-1 │   │\n│  │  - KV Cache Shard 0       │  - KV Cache Shard 1      │  - Shard N-1 │   │\n│  │  - 명령 직렬화 및 전송    │  - 명령 수신 및 실행      │              │   │\n│  └─────────────────────────────────────────────────────────────────────┘   │\n│                              │                                             │\n│                              ▼ (NCCL All-Reduce)                          │\n│                    GPU 간 텐서 동기화 (Collective Communication)           │\n└─────────────────────────────────────────────────────────────────────────────┘\n```\n\n- 각 GPU는 독립적인 `ModelRunner` 프로세스로 실행됩니다.\n- **Rank 0**이 Master Coordinator 역할을 수행하며, 나머지 Rank는 Worker로 동작합니다.\n- 프로세스 간 통신은 **NCCL**(Linux) 또는 **Gloo**(Windows) 백엔드를 사용합니다.\n\n### 1.2 프로세스 초기화 (Process Initialization)\n\n각 `ModelRunner` 프로세스는 자신에게 할당된 GPU에서 독립적으로 초기화됩니다.\n\n| 단계 | Rank 0 (Master) | Worker Ranks |\n|---|---|---|\n| 1. Process Group 초기화 | NCCL 백엔드로 `torch.distributed` 초기화 | 동일 |\n| 2. CUDA Device 설정 | `torch.cuda.set_device(rank)` | 동일 |\n| 3. 모델 로드 | Sharded Weights로 모델 인스턴스화 | 동일 |\n| 4. Sampler 초기화 | 샘플링 설정 로드 | 동일 |\n| 5. Warmup 실행 | 모델 워밍업 | 동일 |\n| 6. KV Cache 할당 | `allocate_kv_cache()` 실행 | 동일 |\n| 7. CUDA Graph 캡처 | Decode 배치용 CUDA Graph 캡처 | 동일 |\n| 8. Shared Memory 생성 | **생성 (create)** | **연결 (attach)** |\n| 9. Barrier 동기화 | 모든 Rank가 준비될 때까지 대기 | 동일 |\n| 10. 실행 루프 진입 | LLMEngine으로 제어 반환 | **이벤트 루프 대기** |\n\n> 💡 **중요**: Worker Rank는 초기화 완료 후 **이벤트 루프(event loop)** 에 진입하여 Master의 명령을 대기합니다. Master만이 LLMEngine으로 제어를 반환하고 요청을 처리합니다.\n\n---\n\n## 🧱 2. Master-Worker 실행 패턴 (Master-Worker Execution Pattern)\n\n### 2.1 명령 디스패치 (Command Dispatch)\n\nMaster-Worker 패턴에서 Rank 0은 모든 분산 연산을 조정합니다.\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                    Master (Rank 0)                              │\n│  1. 실행할 명령 결정 (\"run\", \"exit\" 등)                        │\n│  2. 명령 + 데이터를 Shared Memory에 직렬화(Serialization)       │\n│  3. Worker에게 이벤트 신호(Event Signal) 전송                   │\n│  4. 자신도 동일한 명령을 로컬에서 실행                          │\n└─────────────────────────────────────────────────────────────────┘\n                              │\n                              ▼ (Shared Memory + Event)\n┌─────────────────────────────────────────────────────────────────┐\n│                    Workers (Rank 1, 2, ...)                     │\n│  1. 이벤트 대기(Block)                                          │\n│  2. 이벤트 수신 → Shared Memory에서 명령 읽기(Deserialize)      │\n│  3. 명령 실행 (예: 모델 Forward Pass)                          │\n│  4. 결과를 Shared Memory에 기록 (필요시)                        │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n### 2.2 Shared Memory 프로토콜\n\nMaster와 Worker 간 통신은 **Shared Memory(SHM)** 를 통해 이루어집니다.\n\n```\nShared Memory 메시지 포맷:\n┌──────────────┬──────────────────────────────────────────┐\n│ Bytes 0-3    │ Bytes 4 ~ (4 + message_length)          │\n│ Message 길이 │ Pickle 직렬화된 데이터 [method, *args]   │\n└──────────────┴──────────────────────────────────────────┘\n```\n\n| 동작 | 수행 주체 | 설명 |\n|---|---|---|\n| `write_shm()` | Rank 0 (Master) | 명령을 직렬화하여 Shared Memory에 쓰고, 모든 Worker에 신호 전송 |\n| `read_shm()` | Rank 1+ (Workers) | 이벤트를 대기(Block)하다가, Shared Memory에서 명령을 읽고 역직렬화 |\n\nShared Memory 객체는 `\"nanovllm\"`이라는 이름으로 생성되며, 기본 용량은 **1 MB** (`2**20` bytes)입니다.\n\n### 2.3 지원 명령어 (Supported Commands)\n\n| 명령 | 설명 |\n|---|---|\n| `\"run\"` | 주어진 배치(Batch)에 대해 모델 추론(Inference) 실행 |\n| `\"exit\"` | Worker 프로세스를 종료하고 리소스 정리 |\n\n---\n\n## 🧱 3. Tensor Parallelism (텐서 병렬성)\n\n### 3.1 개념 정의\n\n**Tensor Parallelism**은 모델의 **각 레이어 내부의 가중치 텐서(Weight Tensor)를 여러 GPU에 분할(Shard)** 하여, 단일 GPU 메모리로는 적재할 수 없는 대형 모델을 실행하는 기술입니다.\n\n### 3.2 가중치 분할 (Weight Sharding)\n\nnano-vLLM은 **Megatron-LM의 Tensor Parallelism 알고리즘**을 구현합니다.\n\n```\n[단일 GPU (TP=1)]\n┌─────────────────────────────────────────────────────────────────┐\n│  Linear Layer Weight: [hidden_size, intermediate_size]         │\n│  (예: 4096, 11008) → 전체 가중치를 한 GPU가 보유               │\n└─────────────────────────────────────────────────────────────────┘\n\n[Tensor Parallelism (TP=4)]\n┌─────────────────────────────────────────────────────────────────┐\n│  Linear Layer Weight를 4개 GPU로 분할 (Column-wise Sharding)    │\n│  ┌──────────────┐ ┌──────────────┐ ┌──────────────┐ ┌────────┐ │\n│  │ GPU 0: Col 0 │ │ GPU 1: Col 1 │ │ GPU 2: Col 2 │ │GPU 3   │ │\n│  │ ~ 2752       │ │ ~ 2752       │ │ ~ 2752       │ │~ 2752  │ │\n│  └──────────────┘ └──────────────┘ └──────────────┘ └────────┘ │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n### 3.3 분산 KV Cache (Distributed KV Cache)\n\nTensor Parallelism 환경에서 **KV Cache Heads도 GPU 수에 따라 분할(Shard)** 됩니다.\n\n```\nKV Heads Sharding (TP=4, Num KV Heads = 8):\n┌─────────────────────────────────────────────────────────────────┐\n│  GPU 0 │ GPU 1 │ GPU 2 │ GPU 3 │                              │\n│ Head 0 │ Head 1 │ Head 2 │ Head 3 │ ← 각 GPU가 2개 Head 담당  │\n│ Head 4 │ Head 5 │ Head 6 │ Head 7 │                          │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n각 GPU는 자신이 담당하는 KV Heads에 해당하는 **KV Cache 블록만 할당하고 관리**합니다.\n\n### 3.4 Collective Communication (집단 통신)\n\nTensor Parallelism에서 GPU 간 **All-Reduce** 연산이 필수적입니다.\n\n```\n[Forward Pass에서의 All-Reduce]\n1. 각 GPU가 자신의 Shard에 대해 부분 연산(Partial Computation) 수행\n2. All-Reduce로 모든 GPU의 결과를 집계(Aggregate)하여 동기화\n3. 다음 레이어로 진행\n\n[사용 통신 백엔드]\n- NCCL (Linux): NVIDIA GPU 간 최적화된 고속 통신\n- Gloo (Windows): 크로스-플랫폼 통신 지원\n```\n\n---\n\n## 🧱 4. 병렬화 전략 선택 가이드 (Parallelism Strategy Guide)\n\n| 상황 | 권장 전략 | 설정 예시 |\n|---|---|---|\n| **모델이 단일 GPU에 적재 가능** | 분산 추론 불필요 | TP=1 |\n| **모델이 단일 GPU보다 크지만, 단일 노드的多 GPU에 적재 가능** | Tensor Parallelism (단일 노드) | `tensor_parallel_size=4` (4-GPU 노드) |\n| **모델이 단일 노드보다 큼** | Tensor Parallelism + Pipeline Parallelism | `tensor_parallel_size=8`, `pipeline_parallel_size=2` |\n| **GPU 간 NVLINK 미존재 (예: L40S)** | Pipeline Parallelism 우선 | `tensor_parallel_size=1`, `pipeline_parallel_size=N` |\n| **MoE (Mixture of Experts) 모델** | Data Parallel + Expert Parallel 결합 | `--data-parallel-size=4` |\n\n### 4.1 Pipeline Parallelism (파이프라인 병렬성)\n\nTensor Parallelism이 **레이어 내부**를 분할하는 반면, **Pipeline Parallelism**은 **레이어 간(Layer-wise)** 으로 모델을 분할합니다.\n\n```\n[Pipeline Parallelism (PP=2)]\n┌─────────────────────────────────────────────────────────────────┐\n│  Node 1              │  Node 2                                │\n│  ┌──────────────────┐ │  ┌──────────────────┐                 │\n│  │ Layer 0 ~ 15     │ │  │ Layer 16 ~ 31    │                 │\n│  │ (前半 레이어)    │ │  │ (後半 레이어)    │                 │\n│  └──────────────────┘ │  └──────────────────┘                 │\n└─────────────────────────────────────────────────────────────────┘\n```\n\nPipeline Parallelism은 **GPU 개수가 모델 크기를 균등하게 나누지 못할 때** 유용합니다.\n\n---\n\n## 🔗 Module 6 (Prefix Caching)과의 통합\n\n분산 환경에서 Prefix Caching은 **모든 GPU에서 동일한 해시 테이블을 공유**해야 합니다.\n\n```\n[분산 Prefix Caching]\n┌─────────────────────────────────────────────────────────────────┐\n│  Rank 0 (Master)          │  Rank 1 (Worker)                  │\n│  ┌──────────────────────┐ │  ┌──────────────────────┐         │\n│  │ hash_to_block_id     │ │  │ hash_to_block_id     │         │\n│  │ (전체 해시 인덱스)   │ │  │ (전체 해시 인덱스)   │         │\n│  └──────────────────────┘ │  └──────────────────────┘         │\n│         │ (NCCL Broadcast)│          │                        │\n│         └─────────────────┼──────────┘                        │\n│                           ▼                                   │\n│              모든 Rank가 동일한 해시 테이블 유지               │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n- 해시 테이블은 **모든 Rank에서 동기화(Synchronized)** 되어야 합니다.\n- 새 블록이 할당되면 **Broadcast**를 통해 모든 Rank에 전파됩니다.\n\n---\n\n## 📊 성능 영향\n\n| 지표 | 단일 GPU (TP=1) | Tensor Parallelism (TP=4) |\n|---|---|---|\n| **최대 모델 크기** | 단일 GPU 메모리 한도 (예: 80GB) | **GPU 수 × 메모리 (예: 4×80GB)** |\n| **KV Cache 용량** | 단일 GPU 메모리 여유분 | **GPU 수 × 여유분** (선형 증가) |\n| **Prefill 처리량** | 기준 (1x) | **~3.5x** (통신 오버헤드 고려) |\n| **Decode 처리량** | 기준 (1x) | **~3.0x** (All-Reduce 오버헤드 고려) |\n| **통신 오버헤드** | 없음 | All-Reduce per layer (NCCL 최적화) |\n\n> ⚠️ **트레이드오프 인식**: Tensor Parallelism은 GPU 간 통신(All-Reduce) 오버헤드가 발생합니다. 따라서 **TP 크기를 무한정 늘리는 것은 비효율적**이며, 모델 크기와 GPU 메모리 용량에 맞춰 적절한 TP 값을 선택해야 합니다.\n\n---\n\n## 📝 Brick-by-Brick 학습 관점\n\nModule 7은 지금까지 구축한 **모든 인프라를 다중 GPU로 확장**하는 최종 계층입니다.\n\n```\n[Module 1] KV Cache 존재 인지\n     │\n     ▼\n[Module 2] 연속 할당의 한계(단편화) 인지\n     │\n     ▼\n[Module 3] Continuous Batching (계산 효율)\n     │\n     ▼\n[Module 4] PagedAttention (논리-물리 매핑)\n     │\n     ▼\n[Module 5] Memory Pool + Block Allocator + Swap Manager (물리적 자원 운영)\n     │\n     ▼\n[Module 6] Prefix Caching (Content-Addressable Memory)\n     │\n     ▼\n[Module 7] Distributed Serving ★★★★★\n     → Tensor Parallelism으로 모델 가중치 분할\n     → Master-Worker 패턴으로 다중 GPU 프로세스 조정\n     → NCCL로 GPU 간 All-Reduce 동기화\n     → Shared Memory로 명령/데이터 전달\n     → **단일 GPU의 한계를 넘어, 모델 크기와 처리량을 GPU 수에 비례하여 확장**\n     │\n     ▼\n[Composite] serving_system (전체 vLLM 시스템 완성) ★\n     → Module 1~7의 모든 개념이 통합된 최종 서빙 엔진\n```\n\n> 💡 **최종 인사이트**: Module 7은 vLLM을 **\"단일 GPU 실험실 수준\"**에서 **\"실제 프로덕션 규모\"**로 끌어올리는 마지막 퍼즐 조각입니다. Tensor Parallelism이 없었다면, vLLM은 70B 이상의 대형 모델을 서빙할 수 없었을 것입니다. Module 1~6이 **\"어떻게 한 대의 GPU를 최대한 효율적으로 쓸까?\"** 에 집중했다면, Module 7은 **\"여러 대의 GPU를 어떻게 하나의 시스템처럼 묶을까?\"** 에 답합니다. 이로써 vLLM은 **단일 GPU에서 수백 GPU 클러스터까지 확장 가능한** 통합 서빙 엔진으로 완성됩니다.",

    "group": "composite",
    "body": "# Autoregressive Generation Loop (자기회귀 생성 루프)\n\n## 📌 개념 정의\n\n**Autoregressive Generation Loop**는 Module 01의 핵심 복합 시스템으로, [`decoder_layer`](decoder_layer.md)를 통한 Forward pass, [`kv_cache`](../03_atomic/kv_cache.md) 업데이터, [`sampling`](../03_atomic/sampling.md) 알고리즘을 결합하여 `EOS` 토큰이 생성될 때까지 디코드 루프를 반복 구동합니다.\n\n---\n\n## 🧱 시스템 루프 구조\n\n```\n[Prefill 토큰 텐서 & KV Cache 초기화]\n               │\n               ▼\n   ┌───► [Decode Step Forward Pass] ◄───┐\n   │           │                        │\n   │           ▼                        │\n   │     [KV Cache Append]              │ Repeat Loop\n   │           │                        │ (Until EOS Token)\n   │           ▼                        │\n   │     [Logits & Sampling]            │\n   │           │                        │\n   └───────────┴── Next Token Output ───┘\n```\n\n---\n\n## 🔗 조립 정보 (Composition & Relationships)\n\n- **COMPOSED_OF**:\n  - [`decoder_layer`](decoder_layer.md)\n  - [`kv_cache`](../03_atomic/kv_cache.md)\n  - [`sampling`](../03_atomic/sampling.md)\n- **PREREQUISITES**:\n  - [`inference_model`](inference_model.md)\n- **PREREQUISITE_OF**:\n  - [`continuous_batching`](../03_atomic/continuous_batching.md) (Module 03)",

  {
    "id": "composite.block_manager",
    "title": "Physical Block Manager (물리적 블록 관리자)",
    "type": "CompositeConcept",
    "path": "concepts/02_composite/block_manager.md",
    "group": "composite",
    "body": "# Physical Block Manager (물리적 블록 관리자)\n\n## 📌 개요\n\n**Physical Block Manager**는 Module 5의 최상위 복합 개념으로, 지금까지 학습한 세 가지 원자적 개념([`memory_pool`](../03_atomic/memory_pool.md), [`block_allocator`](../03_atomic/block_allocator.md), [`swap_manager`](../03_atomic/swap_manager.md))을 하나의 통합된 인터페이스로 묶어줍니다.\n\n이 관리자는 **Scheduler(Module 3)**와 **PagedAttention Manager(Module 4)** 사이에서 중개자(Mediator) 역할을 수행하며, 다음과 같은 실질적인 메모리 운영을 담당합니다.\n\n1. **자원 추상화**: Memory Pool을 통해 GPU HBM을 블록 단위로 추상화\n2. **할당 전략 실행**: Block Allocator를 통해 First-Fit/Best-Fit 정책으로 블록 할당\n3. **메모리 부족 대응**: Swap Manager를 호출하여 LRU/LFU 기반으로 블록을 CPU로 스왑아웃\n4. **상태 모니터링**: 현재 가용 블록 수, 할당된 블록 수, 스왑 중인 블록 수를 실시간 추적\n\n---\n\n## 🧱 구성 요소 (Components)\n\n| 구성 요소 | 설명 |\n|---|---|\n| [`atomic.memory_pool`](../03_atomic/memory_pool.md) | GPU HBM을 고정 크기 블록들의 풀로 추상화한 물리적 기반 |\n| [`atomic.block_allocator`](../03_atomic/block_allocator.md) | First-Fit, Best-Fit, Next-Fit 등 다양한 할당 전략을 구현하는 정책 엔진 |\n| [`atomic.swap_manager`](../03_atomic/swap_manager.md) | GPU 메모리 부족 시 블록을 CPU 메모리로 스왑아웃/스왑인하는 관리자 |\n| `atomic.swap_policy` | 스왑아웃 대상 선정 정책 (LRU, LFU, FIFO, Priority-Based) |\n\n---\n\n## 🏗️ 통합 아키텍처 및 계층 구조\n\nPhysical Block Manager는 **Scheduler → PagedAttention Manager → Physical Block Manager**로 이어지는 계층 구조의 최하단에 위치합니다.\n\n```\n┌─────────────────────────────────────────────────────────────────────────┐\n│                      Scheduler (Module 3)                              │\n│  - \"Sequence A에 블록 3개가 필요해. 할당해줘.\"                         │\n│  - \"현재 가용 블록이 몇 개야?\"                                        │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │ (메모리 요청)\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────┐\n│               PagedAttention Manager (Module 4)                        │\n│  - \"요청 받았어. Sequence A의 Block Table을 업데이트해야 해.\"          │\n│  - \"Physical Block Manager에게 물리적 블록 ID를 요청할게.\"             │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │ (물리적 블록 ID 요청)\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────┐\n│              ★ Physical Block Manager (Module 5) ★                    │\n│  ┌─────────────────────────────────────────────────────────────────┐  │\n│  │  1. Memory Pool에서 가용 블록 확인                              │  │\n│  │  2. Block Allocator로 할당 전략 실행 (First-Fit)               │  │\n│  │  3. 가용 블록 부족 시 Swap Manager 호출 (LRU로 스왑아웃)       │  │\n│  │  4. 할당된 물리적 블록 ID(7, 3, 15)를 PagedAttention Manager에 반환│\n│  └─────────────────────────────────────────────────────────────────┘  │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────┐\n│                      GPU HBM (Memory Pool)                            │\n│  Block 7 │ Block 3 │ Block 15 │ ... (실제 물리적 메모리 블록)         │\n└─────────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 🔗 핵심 동작 흐름 (Sequence Diagram)\n\n### 시나리오 1: 정상 할당 (Normal Allocation)\n\n```\n[Scheduler] → [PagedAttention Manager] → [Physical Block Manager] → [Memory Pool]\n\n1. Scheduler가 새 Sequence를 배치에 추가\n2. PagedAttention Manager가 Physical Block Manager에게 블록 3개 요청\n3. Physical Block Manager가 Memory Pool의 Free List에서 블록 3개를 가져옴\n   → (Free List: [0,1,2,3,4,5] → [0,1,2] 할당 → Free List: [3,4,5])\n4. 물리적 블록 ID [7, 3, 15]를 PagedAttention Manager에 반환\n5. PagedAttention Manager가 Block Table에 (Logical 0→Physical 7) 등록\n```\n\n### 시나리오 2: 메모리 부족 시 스와핑 (Swap-Out)\n\n```\n[Scheduler] → [Physical Block Manager] → [Swap Manager] → [CPU Memory]\n\n1. Scheduler가 새 Sequence 추가를 위해 블록 5개 요청\n2. Physical Block Manager가 Memory Pool 확인 → 가용 블록 2개뿐!\n3. Physical Block Manager가 Swap Manager에게 \"블록 3개를 스왑아웃해줘\" 요청\n4. Swap Manager가 Swap Policy(LRU)를 적용하여 가장 오래된 Sequence B의 블록 3개 선택\n5. GPU → CPU로 블록 데이터 복사 (cudaMemcpy)\n6. Memory Pool의 Free List에 블록 3개 추가 → 가용 블록 5개 확보\n7. 새 Sequence에 블록 5개 할당 완료\n```\n\n---\n\n## 🧠 Physical Block Manager의 내부 상태 (State)\n\n```python\n# 개념적 Python 코드\nclass PhysicalBlockManager:\n    def __init__(self):\n        # 1. Memory Pool\n        self.memory_pool = MemoryPool(total_memory=80_GB, block_size=16)\n        \n        # 2. 할당 정보 추적\n        self.allocations = {}  # SeqID → List[PhysicalBlockID]\n        self.free_blocks = self.memory_pool.get_all_block_ids()\n        \n        # 3. Swap Manager 참조\n        self.swap_manager = SwapManager(swap_policy=LRU())\n        \n        # 4. 성능 통계\n        self.stats = {\n            'total_allocated_blocks': 0,\n            'total_swapped_out_blocks': 0,\n            'total_swapped_in_blocks': 0\n        }\n    \n    def allocate_blocks(self, seq_id: str, num_blocks: int) -> List[int]:\n        \"\"\"Sequence에 num_blocks만큼의 물리적 블록을 할당\"\"\"\n        available = len(self.free_blocks)\n        if available >= num_blocks:\n            # 정상 할당\n            allocated = self.free_blocks[:num_blocks]\n            self.free_blocks = self.free_blocks[num_blocks:]\n            self.allocations[seq_id] = allocated\n            return allocated\n        else:\n            # 메모리 부족 → Swap Manager 호출\n            shortage = num_blocks - available\n            evicted_blocks = self.swap_manager.swap_out(shortage)\n            self.free_blocks.extend(evicted_blocks)\n            # 재귀적으로 다시 할당 시도 (또는 루프)\n            return self.allocate_blocks(seq_id, num_blocks)\n    \n    def free_blocks(self, seq_id: str) -> None:\n        \"\"\"Sequence의 모든 블록을 해제\"\"\"\n        if seq_id in self.allocations:\n            self.free_blocks.extend(self.allocations[seq_id])\n            del self.allocations[seq_id]\n```\n\n---\n\n## 🔗 Module 3 + 4와의 통합 인터페이스\n\n| 호출자 (Caller) | Physical Block Manager가 제공하는 인터페이스 | 설명 |\n|---|---|---|\n| **Scheduler (Module 3)** | `get_num_free_blocks()` | 현재 가용 블록 수를 반환 (배치 크기 결정에 사용) |\n| **Scheduler (Module 3)** | `can_allocate(seq_len)` | 특정 Sequence를 할당할 수 있는지 여부를 반환 |\n| **PagedAttention Manager (Module 4)** | `allocate_blocks(seq_id, num_blocks)` | 물리적 블록 ID 목록을 반환 (Block Table 매핑에 사용) |\n| **PagedAttention Manager (Module 4)** | `free_blocks(seq_id)` | Sequence 종료 시 블록을 메모리 풀로 반환 |\n\n---\n\n## 📊 성능 영향 및 트레이드오프\n\n| 측면 | Physical Block Manager 적용 전 | Physical Block Manager 적용 후 |\n|---|---|---|\n| **할당 속도** | 느림 (cudaMalloc 호출, 수백 μs) | **매우 빠름** (포인터 연산, 수 ns) |\n| **메모리 단편화** | 심각 (외부 단편화 30~50%) | **거의 제로 (Near-Zero)** |\n| **메모리 활용률** | 50~70% | **~100%** |\n| **스와핑 지연** | 없음 (OOM 발생 시 시스템 중단) | 있음 (CPU-GPU 복사, 수 ms) |\n| **최대 동시 요청 수** | Memory Pool 크기에 제한 | **Memory Pool + CPU 스왑 용량** (확장됨) |\n| **시스템 안정성** | 낮음 (OOM 위험) | **매우 높음 (Graceful Degradation)** |\n\n> ⚠️ **트레이드오프 인식**: 스와핑은 CPU-GPU 간 메모리 복사를 수반하므로, 과도한 스와핑은 오히려 지연 시간을 증가시킬 수 있습니다. 따라서 Memory Pool 크기를 워크로드에 맞게 적절히 튜닝하고, 스왑 정책(LRU/LFU)을 신중히 선택하는 것이 중요합니다.\n\n---\n\n## 📝 Brick-by-Brick 학습 관점\n\n이 복합 개념은 Module 5의 **정점(Peak)**으로, 지금까지 학습한 모든 메모리 관리 개념을 하나의 운영 가능한 시스템으로 통합합니다.\n\n```\n[Module 1] KV Cache 존재 인지\n     │\n     ▼\n[Module 2] 연속 할당의 한계(단편화) 인지 → \"메모리를 어떻게 조각 없이 관리할까?\"\n     │\n     ▼\n[Module 3] Continuous Batching (계산 효율) → \"GPU를 어떻게 쉬지 않게 할까?\"\n     │\n     ▼\n[Module 4] PagedAttention + PagedAttention Manager (논리-물리 매핑)\n     │  → \"주소를 어떻게 변환할까?\" (Mapping Layer)\n     │\n     ▼\n[Module 5 - 원자적 개념]\n     ├── memory_pool   → \"메모리를 어떻게 미리 준비해둘까?\" (Foundation)\n     ├── block_allocator → \"어떤 전략으로 할당할까?\" (Strategy)\n     └── swap_manager    → \"부족하면 어떻게 대처할까?\" (Safety Net)\n     │\n     ▼\n[Module 5 - Composite ★★★★★]\n     └── Physical Block Manager\n          → 위 세 가지를 통합하여 Scheduler와 PagedAttention Manager에게\n            **하나의 일관된 메모리 관리 인터페이스**를 제공\n          → 이것이 실제 vLLM이 동작하는 **메모리 운영 체제(Memory OS)**임.\n     │\n     ▼\n[Module 6] Prefix Caching (이 위에 캐시 최적화 계층 추가)\n     │\n     ▼\n[Module 7] Distributed Serving (이 위에 분산 확장 계층 추가)\n```\n\n> 💡 **최종 인사이트**: Module 4의 `PagedAttention Manager`가 **\"주소 변환기(Translator)\"**라면, Module 5의 `Physical Block Manager`는 **\"자원 관리자(Resource Manager)\"**입니다. 전자는 논리적 질문(\"이 토큰은 어디에 있나?\")에 답하고, 후자는 물리적 질문(\"이 블록을 어디서 가져오고, 부족하면 어떻게 할까?\")에 답합니다. 이 두 관리자가 함께 동작할 때 vLLM은 메모리 단편화 없이, OOM 없이, 그리고 최대 처리량으로 동작할 수 있습니다.\n\n\n> **⚠️ Module 4와 Module 5 Block Manager의 명확한 구분 (중요)**:\n> - **Module 4의 [`composite.paged_attention_manager`](paged_attention_manager.md)**: **논리적 주소 변환 엔진** (Block Table 관리, Slot Mapping 계산, 논리→물리 매핑을 담당)\n> - **Module 5의 [`composite.block_manager`](block_manager.md)**: **물리적 자원 운영 엔진** (Memory Pool에서 블록을 할당/해제하고, 메모리 부족 시 Swap Manager를 호출하는 **실제 메모리 관리자**)\n>\n> 즉, Module 4는 **\"어떻게 매핑할까?\"** (Mapping), Module 5는 **\"어떻게 할당/해제하고 부족할 때 대처할까?\"** (Allocation & Swapping)를 담당합니다.\n\n---\n\n```markdown",

    "title": "Prefix Caching Strategy & Manager (프리픽스 캐싱 전략 및 관리자)",
    "type": "CompositeConcept",
    "path": "concepts/02_composite/caching_strategy.md",
    "group": "composite",
    "body": "# Prefix Caching Strategy & Manager (프리픽스 캐싱 전략 및 관리자)\n\n## 📌 개요\n\n**Prefix Caching Strategy & Manager**는 Module 5의 `Physical Block Manager` 위에 구축된 **지능형 캐싱 계층**입니다.\n\nModule 5는 \"물리적 블록을 어떻게 할당/해제하고 스왑할까?\"라는 **물리적 자원 운영**에 집중했습니다. Module 6의 `Prefix Cache Manager`는 여기에 **\"어떤 블록이 이미 계산되었는지 식별하고, 동일한 계산을 반복하지 않게 하려면 어떻게 해야 할까?\"**라는 **논리적 최적화**를 추가합니다.\n\n**이 관리자의 핵심 책임**:\n1. **Content-Addressable 식별**: xxHash 기반 체인 해시로 블록의 고유성을 판별\n2. **캐시 조회 및 히트/미스 판정**: `hash_to_block_id` 역인덱스를 통한 O(1) 조회\n3. **참조 기반 공유 관리**: `ref_count`로 여러 Sequence가 동일 블록을 공유하는 상황 추적\n4. **캐시 미스 전파**: 프리픽스 중간에 미스가 발생하면 이후 블록은 모두 미스 처리하여 불필요한 해시 계산 방지\n5. **캐시 만료(Eviction)**: 참조 카운터가 0이 된 블록을 LRU 정책으로 해제하여 메모리 확보\n\n---\n\n## 🧱 구성 요소 (Components)\n\n| 구성 요소 | 설명 |\n|---|---|\n| `atomic.content_hash` | xxHash64 기반 블록 내용 해시 계산기 |\n| `atomic.hash_chain` | 이전 블록의 해시를 시드로 포함하는 **체인 해시**로 프리픽스 연속성 보장 |\n| `atomic.hash_to_block_id` | 해시값 → 물리적 블록 ID를 매핑하는 **전역 역인덱스 (Global Reverse Index)** |\n| `atomic.ref_count` | 각 블록을 참조 중인 Sequence의 수를 추적하는 참조 카운터 |\n| `atomic.cache_miss_propagation` | 중간 블록에서 캐시 미스 발생 시 이후 모든 블록을 미스 처리하는 최적화 전략 |\n\n---\n\n## 🏗️ 통합 아키텍처 (Integrated Architecture)\n\nPrefix Cache Manager는 `Physical Block Manager`를 **래핑(Wrapping)** 하여, 기존 할당/해제 로직 앞에 **캐시 조회 단계**를 추가합니다.\n\n```\n┌─────────────────────────────────────────────────────────────────────────┐\n│                         Scheduler (Module 3)                           │\n│  - \"Sequence A의 Token IDs를 할당해줘\"                                 │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼ (Token IDs + num_blocks)\n┌─────────────────────────────────────────────────────────────────────────┐\n│              ★ Prefix Cache Manager (Module 6) ★                       │\n│  ┌─────────────────────────────────────────────────────────────────┐  │\n│  │  Step 1: can_allocate (캐시 가능 블록 수 계산)                 │  │\n│  │    - Block 0: 체인 해시 계산 → hash_to_block_id 조회 (HIT/MISS) │  │\n│  │    - Block 1: 체인 해시 계산 (이전 해시 포함) → 조회          │  │\n│  │    - 중간에 MISS 발생 시 → cache_miss_propagation 적용          │  │\n│  │    - 반환: num_cached_blocks, num_new_blocks                   │  │\n│  └─────────────────────────────────────────────────────────────────┘  │\n│                              │                                        │\n│                              ▼ (캐시 HIT 블록: ref_count 증가)       │\n│  ┌─────────────────────────────────────────────────────────────────┐  │\n│  │  Step 2: allocate (실제 할당 실행)                             │  │\n│  │    - HIT: hash_to_block_id에서 block_id 조회 → ref_count++     │  │\n│  │    - MISS: Physical Block Manager에 새 블록 할당 요청          │  │\n│  │           → 새 block_id 반환 → ref_count=1로 초기화           │  │\n│  │           → hash_to_block_id에 (hash → block_id) 등록          │  │\n│  └─────────────────────────────────────────────────────────────────┘  │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼ (MISS 시에만 호출)\n┌─────────────────────────────────────────────────────────────────────────┐\n│                    Physical Block Manager (Module 5)                   │\n│  - Memory Pool에서 물리적 블록 ID 할당                                 │\n│  - Free List 업데이트                                                  │\n│  - Swap Manager 호출 (메모리 부족 시)                                  │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────┐\n│                      GPU HBM (Memory Pool)                             │\n│  - 블록 7, 3, 15 (물리적 메모리)                                      │\n└─────────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 🔗 핵심 동작 메커니즘 (Core Mechanism)\n\n### 1. 체인 해시 계산 (Chain Hash Computation)\n\n프리픽스의 연속성을 보장하기 위해, 각 블록의 해시는 **이전 블록 해시를 시드(Seed)로 포함**합니다.\n\n```python\ndef compute_block_hash(token_ids: List[int], prev_hash: int) -> int:\n    \"\"\"\n    이전 블록의 해시를 포함한 체인 해시 계산.\n    - BLOCK_SIZE = 16 (고정)\n    - xxHash64 알고리즘 사용\n    \"\"\"\n    hasher = xxhash.xxh64(seed=prev_hash)  # 이전 해시를 시드로 사용\n    hasher.update(bytes(token_ids))\n    return hasher.intdigest()\n```\n\n**예시** (`BLOCK_SIZE = 4`):\n\n| 블록 | 토큰 ID | 이전 해시 | 계산된 해시 |\n|---|---|---|---|\n| Block 0 | [1, 2, 3, 4] | 0 (초기값) | `H0` |\n| Block 1 | [5, 6, 7, 8] | `H0` | `H1` |\n| Block 2 | [9, 10, 11, 12] | `H1` | `H2` |\n\n> 💡 **이점**: 동일한 `[5, 6, 7, 8]` 블록이라도 이전 블록 해시가 다르면(`H0` vs `H100`) **완전히 다른 해시값**이 생성됩니다. 따라서 **프리픽스가 완전히 일치하는 경우에만** 캐시 히트가 발생합니다.\n\n### 2. 캐시 조회 및 히트/미스 판정 (Cache Lookup)\n\n```python\ndef can_allocate(self, seq_token_ids: List[int]) -> Tuple[int, int]:\n    \"\"\"\n    Sequence의 블록 중 캐시 히트 가능한 개수와 새로 할당해야 할 개수를 계산.\n    \"\"\"\n    num_blocks = len(seq_token_ids) // BLOCK_SIZE\n    num_cached = 0\n    prev_hash = -1\n    \n    for i in range(0, len(seq_token_ids), BLOCK_SIZE):\n        block_tokens = seq_token_ids[i:i+BLOCK_SIZE]\n        block_hash = self.compute_hash(block_tokens, prev_hash)\n        \n        if block_hash in self.hash_to_block_id:\n            num_cached += 1\n            prev_hash = block_hash\n        else:\n            # ★ 캐시 미스 발생! 이후 모든 블록은 미스 처리 ★\n            break  \n    \n    num_new = num_blocks - num_cached\n    return num_cached, num_new\n```\n\n> ⚠️ **cache_miss_propagation**: 중간 블록에서 미스가 발생하면, 그 이후 블록들은 **무조건 미스**로 간주합니다. 이는 프리픽스가 달라지면 이후 모든 내용이 달라진다는 LLM의 특성에 기반한 최적화입니다.\n\n### 3. 참조 기반 공유 관리 (Reference Counting)\n\n각 블록은 `ref_count`를 유지하여 몇 개의 Sequence가 해당 블록을 참조 중인지 추적합니다.\n\n| 동작 | ref_count 변화 |\n|---|---|\n| **캐시 히트 (Cache Hit)** | `ref_count += 1` (기존 블록 재사용) |\n| **새 블록 할당 (Cache Miss)** | `ref_count = 1` (새 블록 생성) |\n| **Sequence 종료 (Free)** | `ref_count -= 1` (참조 해제) |\n| **ref_count == 0** | 블록이 사용되지 않음 → **Eviction 후보** (해시 테이블에서 제거 및 메모리 반환) |\n\n```python\ndef free_blocks(self, seq_id: str):\n    \"\"\"Sequence의 모든 블록 참조를 해제\"\"\"\n    for block_id in self.block_tables[seq_id]:\n        self.blocks[block_id].ref_count -= 1\n        if self.blocks[block_id].ref_count == 0:\n            # 참조가 0이면 해시 테이블에서 제거 및 메모리 해제\n            block_hash = self.blocks[block_id].hash\n            del self.hash_to_block_id[block_hash]\n            self.physical_block_manager.free_block(block_id)\n```\n\n### 4. 캐시 만료 정책 (Eviction Policy)\n\nPrefix Cache Manager는 `ref_count == 0`인 블록 중에서 **LRU(Least Recently Used)** 정책으로 캐시를 만료(Evict)합니다.\n\n- **LFU (Least Frequently Used)**: 사용 빈도가 낮은 블록 우선 해제\n- **FIFO (First In First Out)**: 가장 오래된 블록 우선 해제\n- **vLLM 기본**: **LRU** (구현 단순, 실제 워크로드에 가장 효과적)\n\n---\n\n## 🔗 Module 5 Physical Block Manager와의 통합 (Integration)\n\nPrefix Cache Manager는 **Physical Block Manager를 포함(Composition)** 하여 구현됩니다.\n\n```python\nclass PrefixCacheManager:\n    def __init__(self, physical_block_manager: PhysicalBlockManager):\n        self.physical = physical_block_manager  # Module 5 의존성\n        \n        # Module 6 전용 자료구조\n        self.hash_to_block_id = {}  # hash → Physical Block ID\n        self.blocks = {}            # block_id → BlockMetadata (ref_count, hash, token_ids)\n        self.access_log = []        # LRU eviction을 위한 접근 시간 기록\n    \n    def allocate(self, seq_id: str, token_ids: List[int]):\n        # ... (캐시 조회 로직)\n        \n        if block_hash in self.hash_to_block_id:\n            # HIT: 기존 블록 재사용 (Physical Block Manager 호출 없음!)\n            block_id = self.hash_to_block_id[block_hash]\n            self.blocks[block_id].ref_count += 1\n        else:\n            # MISS: Physical Block Manager에 할당 요청\n            block_id = self.physical.allocate_block()  # Module 5\n            self.blocks[block_id] = BlockMetadata(\n                ref_count=1,\n                hash=block_hash,\n                token_ids=block_tokens\n            )\n            self.hash_to_block_id[block_hash] = block_id\n```\n\n> 💡 **계층 분리의 이점**: Prefix Cache Manager는 **\"캐시 히트 시 Physical Block Manager를 전혀 호출하지 않습니다\"** (Zero Overhead). 즉, 캐시 히트가 발생하면 메모리 할당/해제 오버헤드가 **완전히 제거**됩니다.\n\n---\n\n## 📊 성능 영향 (Performance Impact)\n\n| 지표 | Prefix Caching 없음 | Prefix Caching 적용 |\n|---|---|---|\n| **동일 프리픽스 요청 간 메모리 사용** | N개 요청 = N × KV Cache 크기 | N개 요청 = **1 × KV Cache 크기** (공유) |\n| **Prefill 연산** | 모든 요청에서 전체 프롬프트 Prefill | **캐시된 프리픽스에 대한 Prefill 생략** |\n| **First Token Latency (TTFT)** | 프롬프트 전체 길이에 비례 | **프리픽스 길이만큼 단축** (예: 60% 단축) |\n| **캐시 조회 오버헤드** | 없음 | xxHash 계산 + Dict Lookup (수 μs) |\n| **메모리 할당/해제 호출** | 매 요청마다 발생 | **캐시 히트 시 전혀 발생하지 않음** |\n| **처리량 (Throughput)** | 기준 (1x) | **캐시 히트율에 따라 2~10x 향상** |\n\n---\n\n## 📝 Brick-by-Brick 학습 관점\n\n이 복합 개념은 Module 6의 **정점**으로, 지금까지 구축한 물리적 인프라 위에 **지능적 최적화 계층**을 올립니다.\n\n```\n[Module 1] KV Cache 존재 인지\n     │\n     ▼\n[Module 2] 연속 할당의 한계(단편화) 인지\n     │\n     ▼\n[Module 3] Continuous Batching (계산 효율)\n     │\n     ▼\n[Module 4] PagedAttention + PagedAttention Manager (논리-물리 매핑)\n     │\n     ▼\n[Module 5] Physical Block Manager (물리적 자원 운영: 할당/해제/스왑)\n     │\n     ▼\n[Module 6 - Composite ★★★★★]\n     └── Prefix Cache Manager\n          → Physical Block Manager를 감싸는 Wrapper\n          → \"이미 계산된 프리픽스인가?\"를 묻고, 맞으면 재사용\n          → xxHash 체인 해시로 프리픽스 식별\n          → hash_to_block_id 역인덱스로 O(1) 조회\n          → ref_count로 블록 공유 관리\n          → ref_count=0인 블록은 LRU로 Eviction\n          → **결과: 동일 프리픽스 요청 간 메모리/연산 낭비 제거**\n     │\n     ▼\n[Module 7] Distributed Serving (분산 환경으로 확장)\n```\n\n> 💡 **최종 인사이트**: Prefix Cache Manager는 **\"이미 계산한 것은 다시 계산하지 말고, 이미 할당한 메모리는 다시 할당하지 말자\"** 는 가장 직관적인 최적화 원칙을 시스템적으로 구현합니다. 이 관리자가 없다면 vLLM은 시스템 프롬프트가 동일한 100개의 채팅 요청에 대해 **100번의 동일한 Prefill 연산**을 수행해야 합니다. 이 관리자가 있으면 **단 1번의 Prefill**로 충분합니다. 이것이 바로 vLLM이 실제 프로덕션 환경에서 **압도적인 처리량**을 달성하는 핵심 비결입니다.",

    "body": "# Transformer Decoder Layer (트랜스포머 디코더 레이어)\n\n## 📌 개념 정의\n\n**Decoder Layer**는 [`attention`](../03_atomic/attention.md) 연산 블록과 [`ffn`](../03_atomic/ffn.md) 블록이 잔차 연결(Residual Connection) 및 층 정규화(RMSNorm/LayerNorm)와 조합되어 수십 층으로 쌓이는 복합 개념 구조입니다.\n\n---\n\n## 🧱 구조적 파이프라인\n\n```\nInput x\n  │\n  ├──► RMSNorm ──► Attention ──(KV Cache Sync)──┐\n  │                                             │\n  ▼                                             ▼\nAdd Residual <──────────────────────────────────┘\n  │\n  ├──► RMSNorm ──► Feed-Forward (FFN) ──────────┐\n  │                                             │\n  ▼                                             ▼\nAdd Residual <──────────────────────────────────┘\n  │\nOutput Layer Token Hidden State\n```\n\n---\n\n## 🔗 조립 정보 (Composition & Relationships)\n\n- **COMPOSED_OF**:\n  - [`attention`](../03_atomic/attention.md)\n  - [`ffn`](../03_atomic/ffn.md)\n- **PREREQUISITE_OF**:\n  - [`autoregressive_loop`](autoregressive_loop.md)",

    "group": "composite",
    "body": "# Distributed Serving System (분산 서빙 시스템)\n\n## 📌 개요\n\n**Distributed Serving System**은 Module 7의 최상위 복합 개념으로, 지금까지 구축한 모든 단일 GPU 최적화(Continuous Batching, PagedAttention, Memory Pool, Prefix Caching)를 **다중 GPU 및 다중 노드 환경으로 확장**하고, 이를 **외부 클라이언트가 사용할 수 있는 안정적인 서비스**로 포장(Wrapping)합니다.\n\n이 시스템은 크게 두 가지 계층으로 구성됩니다:\n\n1. **분산 실행 엔진 (Distributed Execution Engine)** – Tensor Parallelism, NCCL 통신, Master-Worker 패턴을 통해 모델을 여러 GPU에 분할하고 동기화\n2. **서비스 인프라 (Service Infrastructure)** – 로드 밸런서, 장애 허용, 분산 KV 캐시, 모니터링을 통해 고가용성과 확장성 제공\n\n> 💡 **실제 배포 관점**: 이 시스템은 클라이언트가 `POST /kv/{key}` 요청을 보내면, 수천~수만 QPS를 처리하면서도 1~2ms의 지연 시간을 유지하고, GPU 장애 시 자동으로 복구되는 **운영 수준(Production-Grade)**의 서비스를 구현합니다.\n\n---\n\n## 🏗️ 전체 아키텍처 (End-to-End Architecture)\n\n```\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                              클라이언트 (Client)                            │\n│                    HTTP/gRPC/JSON-RPC 요청 (KV-API)                        │\n└─────────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                        1. Load Balancer (로드 밸런서)                       │\n│  - 라운드-로빈 / 가중 라운드-로빈 / 최소 연결 정책 적용                     │\n│  - 헬스 체크(Health Check)로 가용 노드 풀 유지                              │\n│  - 요청을 적절한 KV 노드로 라우팅                                          │\n└─────────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                   2. Distributed KV (분산 키-값 저장소)                     │\n│  ┌─────────────────────────────────────────────────────────────────────┐   │\n│  │  Partitioner (파티셔너)                                            │   │\n│  │  - 요청 키 → hash(key) % num_partitions 로 파티션 번호 계산        │   │\n│  │  - 메타 서비스에서 해당 파티션의 현재 리더(Primary) 노드 조회      │   │\n│  └─────────────────────────────────────────────────────────────────────┘   │\n│  ┌─────────────────────────────────────────────────────────────────────┐   │\n│  │  Replica Manager (복제 관리자)                                      │   │\n│  │  - 쓰기: 리더에 쓰고, 동기/비동기 방식으로 복제본에 전파           │   │\n│  │  - 읽기: 일관성 요구에 따라 리더 또는 팔로워에서 읽기               │   │\n│  └─────────────────────────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼ (실제 추론 연산)\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                   3. Distributed Executor (분산 실행 엔진)                  │\n│  ┌─────────────────────────────────────────────────────────────────────┐   │\n│  │  Tensor Parallelism (TP) Group                                     │   │\n│  │  ┌──────────┐ ┌──────────┐ ┌──────────┐ ┌──────────┐              │   │\n│  │  │  GPU 0   │ │  GPU 1   │ │  GPU 2   │ │  GPU 3   │              │   │\n│  │  │ (Rank 0) │ │ (Rank 1) │ │ (Rank 2) │ │ (Rank 3) │              │   │\n│  │  │ Master   │ │ Worker   │ │ Worker   │ │ Worker   │              │   │\n│  │  └──────────┘ └──────────┘ └──────────┘ └──────────┘              │   │\n│  │       │            │            │            │                     │   │\n│  │       └────────────┴────────────┴────────────┘                     │   │\n│  │                    NCCL All-Reduce (집단 통신)                      │   │\n│  └─────────────────────────────────────────────────────────────────────┘   │\n│  - 모델 가중치를 TP 크기만큼 분할(Shard)하여 각 GPU에 적재               │\n│  - Prefill/Decode 단계에서 All-Reduce로 중간 결과 동기화                  │\n└─────────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                   4. Fault Tolerance (장애 허용)                           │\n│  - Health Checker: 노드 응답 지연/실패 감지 → 장애 선언                   │\n│  - Leader Election: 장애 노드가 담당하던 파티션의 리더를 다른 노드로 교체 │\n│  - Replica Rebalancer: 새로운 복제본을 생성하고, 복제 지연 최소화          │\n│  - Load Balancer 라우팅 테이블 자동 업데이트 → 트래픽 재라우팅             │\n│  - 전체 복구 시간: 수초 이내 (클라이언트는 투명하게 서비스 이용 가능)      │\n└─────────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                   5. Observability (모니터링, 선택)                        │\n│  - 요청 수, 성공률, 레이턴시, 복제 지연 등 실시간 대시보드                │\n│  - Prometheus + Grafana 또는 자체 메트릭 수집기 연동                       │\n└─────────────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 🧩 구성 요소 (Components)\n\n| 구성 요소 | 설명 |\n|---|---|\n| `composite.distributed_executor` | Tensor Parallelism, NCCL, Master-Worker를 통합한 분산 실행 엔진 (Module 7 핵심) |\n| [`atomic.distributed_kv`](../03_atomic/distributed_kv.md) | 각 GPU의 KV Cache 블록을 파티셔닝하고 복제하여 분산 저장소로 추상화 |\n| [`atomic.load_balancer`](../03_atomic/load_balancer.md) | 클라이언트 요청을 가용 노드에 분산하고, 헬스 체크로 노드 상태 관리 |\n| [`atomic.fault_tolerance`](../03_atomic/fault_tolerance.md) | 장애 감지, 리더 재선출, 복제 재배치를 통해 시스템 자가 회복 |\n| `atomic.observability` | 메트릭, 로깅, 분산 트레이싱을 통한 운영 가시성 확보 (선택적) |\n\n---\n\n## 🔗 주요 동작 흐름 (End-to-End Flow)\n\n### 1. 쓰기/읽기 요청 처리 (KV-API)\n\n| 단계 | 구성 요소 | 상세 작업 |\n|---|---|---|\n| **1. 요청 수신** | Load Balancer | 클라이언트 HTTP/gRPC/JSON-RPC 요청 수신, 헬스 체크 결과에 따라 가용 인스턴스 풀 유지 |\n| **2. 라우팅 결정** | Load Balancer (알고리즘) | 라운드-로빈, 가중 라운드-로빈, 최소 연결 등 정책 적용 → 선택된 KV 노드 ID 반환 |\n| **3. 파티션 매핑** | Distributed KV – Partitioner | 요청 키 → `hash(key) % num_partitions`로 파티션 번호 계산, 메타 서비스에서 해당 파티션의 현재 리더(Primary) 노드 식별 |\n| **4. 쓰기/읽기 실행** | Distributed KV – Replica Manager | 쓰기: 리더에 쓰고, 복제본에 동기/비동기 복제 <br> 읽기: 일관성 요구에 따라 리더 또는 팔로워에서 읽기 |\n| **5. 응답 반환** | Load Balancer | KV 노드에서 받은 결과를 클라이언트에 그대로 전달 |\n\n### 2. 장애 복구 시퀀스 (Fault Recovery)\n\n1. Node A가 Heartbeat 실패 → Health Checker가 장애 감지\n2. Fault Tolerance 모듈이 Node A가 담당하던 **파티션 12의 리더**를 Node B로 교체 (Leader Election)\n3. Load Balancer가 라우팅 테이블을 즉시 업데이트하고, 향후 요청을 Node B로 전송\n4. Replica Rebalancer가 Node C에 새로운 복제본을 생성하고, 복제 지연을 최소화\n5. 전체 과정은 **수초 이내**에 완료되어 클라이언트는 투명하게 서비스 이용 가능\n\n---\n\n## 📐 일관성 및 가용성 옵션 (Consistency & Availability)\n\n분산 KV 시스템은 사용 사례에 따라 다양한 일관성 수준을 제공합니다.\n\n| 옵션 | 설명 | 사용 시점 |\n|---|---|---|\n| **Strong Consistency** (강한 일관성) | 쓰기 성공 시 모든 복제본이 최신 로그에 도달해야 함. 장애 시 쓰기 일시 중단. | 거래형 데이터, 정확성 필수 (예: 결제, 계정 잔액) |\n| **Eventual Consistency** (최종 일관성) | 쓰기 직후 일부 복제본이 업데이트되지 않아도 OK. 백그라운드 동기화. | 캐시, 로그, 대용량 비정형 데이터 (추천, 로그 수집) |\n| **Read-Only Fallback** (읽기 전용 대체) | 리더 장애 시 일시적으로 읽기 전용 모드로 전환, 쓰기 거부 후 복구 시 재개. | 높은 가용성이 필수인 서비스 (읽기 트래픽이 많은 경우) |\n\nvLLM의 KV Cache는 **Eventual Consistency**를 기본으로 하며, 필요에 따라 Strong Consistency를 선택할 수 있습니다.\n\n---\n\n## 🔗 Module 6 (Prefix Caching)과의 통합\n\n분산 환경에서 Prefix Caching은 **모든 GPU에서 동일한 해시 테이블을 공유**해야 합니다.\n\n- 해시 테이블(`hash_to_block_id`)은 **모든 Rank에서 동기화(Synchronized)**되어야 함\n- 새 블록이 할당되면 **NCCL Broadcast**를 통해 모든 Rank에 전파\n- 캐시 히트 시에는 **NCCL 통신 없이** 각 GPU가 로컬 해시 테이블에서 바로 블록 ID를 조회 (Zero Overhead)\n\n```python\n# 분산 Prefix Caching 동기화 예시\ndef sync_hash_table_across_ranks():\n    if rank == 0:  # Master\n        serialized = pickle.dumps(hash_to_block_id)\n        torch.distributed.broadcast(torch.tensor(len(serialized)), src=0)\n        torch.distributed.broadcast(torch.tensor(serialized), src=0)\n    else:  # Workers\n        length = torch.distributed.recv(...)\n        serialized = torch.distributed.recv(...)\n        hash_to_block_id = pickle.loads(serialized)\n```\n\n---\n\n## 📊 성능 및 확장성 (Performance & Scalability)\n\n| 지표 | 단일 GPU | 분산 서빙 (TP=4) | 분산 서빙 + Prefix Caching |\n|---|---|---|---|\n| **최대 모델 크기** | 단일 GPU 메모리 한도 | **GPU 수 × 메모리** | 동일 |\n| **KV Cache 용량** | 단일 GPU 여유분 | **GPU 수 × 여유분** | 동일 |\n| **처리량 (Throughput)** | 1x | **~3.5x** (통신 오버헤드) | **~5-10x** (캐시 히트 시) |\n| **지연 시간 (Latency)** | 기준 | 약간 증가 (All-Reduce) | **Prefix Hit 시 대폭 감소** |\n| **가용성 (Availability)** | 단일 장애점 (SPOF) | **고가용 (자동 복구)** | 동일 |\n| **최대 QPS** | 제한적 | **수천~수만 QPS** | 동일 |\n\n---\n\n## 📝 Brick-by-Brick 학습 관점\n\n`distributed_serving`은 Module 7의 정점이자, **전체 vLLM 학습 여정의 완성**입니다.\n\n```\n[Module 1] KV Cache 존재 인지\n     │\n     ▼\n[Module 2] 연속 할당의 한계(단편화) 인지\n     │\n     ▼\n[Module 3] Continuous Batching (계산 효율)\n     │\n     ▼\n[Module 4] PagedAttention (논리-물리 매핑)\n     │\n     ▼\n[Module 5] Physical Block Manager (물리적 자원 운영)\n     │\n     ▼\n[Module 6] Prefix Caching (Content-Addressable Memory)\n     │\n     ▼\n[Module 7 - 분산 실행] Tensor Parallelism + NCCL + Master-Worker\n     │\n     ▼\n[Module 7 - 서비스 인프라] Load Balancer + Fault Tolerance + Distributed KV\n     │\n     ▼\n[★ 최종 완성] Distributed Serving System\n     → 엔드-투-엔드 분산 서비스 스택\n     → 클라이언트 요청 → 로드 밸런싱 → 분산 KV → TP 실행 → 장애 복구 → 응답\n     → vLLM이 실제 프로덕션 환경에서 운영되는 최종 형태\n```\n\n> 💡 **최종 인사이트**: `distributed_serving`은 지금까지 학습한 모든 개념(Continuous Batching, PagedAttention, Memory Pool, Prefix Caching, Tensor Parallelism, NCCL, Master-Worker)을 **하나의 운영 가능한 서비스**로 통합한 결과물입니다. 이 시스템은 단일 GPU로는 불가능했던 대형 모델(70B+)을 다중 GPU로 서빙하고, 수천~수만 QPS를 처리하며, 장애 시 자동 복구되는 **진정한 프로덕션-레디(Production-Ready) LLM 서빙 엔진**을 완성합니다. 이것이 바로 vLLM이 업계에서 가장 널리 사용되는 오픈소스 LLM 서빙 엔진이 된 이유입니다.",

    "path": "concepts/02_composite/dynamic_batcher.md",
    "group": "composite",
    "body": "# Dynamic Batcher (동적 배치 엔진)\n\n## 📌 개념 정의\n\n**Dynamic Batcher**는 [`continuous_batching`](../03_atomic/continuous_batching.md)(연속 배치)과 [`iteration_level_scheduling`](../03_atomic/iteration_level_scheduling.md)(반복 수준 스케줄링)을 결합한 복합 개념입니다.  \n기존 Static Batching(정적 배치)이 하나의 긴 요청 때문에 전체 배치가 블로킹(Blocking)되어 GPU가 유휴 상태로 남는 문제를 해결합니다.\n\n---\n\n## 🧱 Core Technical Analysis: Static vs Continuous Batching\n\n### 1. Static Batching (The Baseline & Bottleneck)\n\n**Static Batching**은 고정된 요청 집합으로 배치를 구성하고, 해당 배치의 모든 요청이 현재 단계(Phase)를 완전히 마칠 때까지 처리한 후 다음 배치로 넘어가는 전통적인 방식입니다.\n\n- **Process**: 고정된 요청 집합으로 배치 구성 → 시스템이 각 요청의 현재 단계(전체 Prefill, 전체 Decode)의 모든 토큰을 처리 → 다음 배치로 이동.\n- **Inefficiency (비효율성)**: Decode 단계에서 **하나의 긴 요청(Long-running request)**이 전체 배치를 병목(Stall)시킵니다. 짧은 요청들이 기다리는 동안 GPU는 유휴(Idle) 상태로 남게 되어 **GPU 활용률이 30~50%**에 그치고, **긴 꼬리 지연 시간(High tail latency)**이 발생합니다. 자원이 심각하게 낭비됩니다.\n\n```\nGPU 시간 축 (Static Batching):\n[Batch 1 처리] → [Decode A (긴 요청)만 실행] → [유휴(Idle)] → [Batch 2 처리] ...\n▉▉▉▉▉▉▉▉▉▉ ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░ ████████ ░░░░░░░░░░░░░░░░\n          ↑ GPU가 놀고 있음 (30~50% 활용률)\n```\n\n### 2. Continuous Batching (Iteration-Level Scheduling)\n\n**Continuous Batching**은 **매 스케줄링 반복(Iteration)**마다 배치를 새롭게 구성하는 방식으로, 배치 구성을 개별 요청의 생명주기(Lifecycle)로부터 분리(Decouple)합니다.\n\n- **Core Idea**: 배치 구성(Composition)을 개별 요청의 생명주기에서 분리하여, 매 반복마다 실행 가능한 요청들로 최적의 배치를 새로 구성합니다.\n\n- **Process (작동 과정)**:\n  1. **Selection (선택)**: 스케줄러가 실행 준비가 된(처리할 토큰이 있는) 요청들을 선택합니다.\n  2. **Packing (패킹)**: 각 요청의 **다음 계산 단계(Next computational step)**를 하나의 배치로 묶습니다.\n     - 새 요청의 **Prefill 단계** (전체 프롬프트 처리)\n     - 진행 중인 요청의 **Decode 단계** (다음 토큰 1개 처리)\n  3. **Execution (실행)**: GPU가 이 **혼합(Heterogeneous) 배치**를 실행합니다.\n  4. **Update & Dissolve (갱신 및 해체)**: 결과를 반환하고, 요청 상태를 갱신하며, 배치는 **즉시 해체(Dissolve)**됩니다. 스케줄러는 **바로 다음 배치**를 구성합니다.\n\n- **Efficiency (효율성)**:\n  - GPU가 **지속적으로 포화(Saturated)** 상태를 유지합니다 (활용률 90% 이상).\n  - 짧은 요청은 긴 요청에 **차단(Block)되지 않고** 완료되어 자원을 즉시 해제합니다.\n\n```\nGPU 시간 축 (Continuous Batching):\n[Prefill A,B,C] → [Decode A,B,C] → [Decode A,C + Prefill D] → [Decode A,C,D + Prefill E] → ...\n▉▉▉▉▉▉▉▉▉▉ ▉▉▉▉▉ ▉▉▉▉▉▉▉▉▉▉▉ ▉▉▉▉▉▉▉▉▉▉▉▉▉▉ ▉▉▉▉▉▉\n          ↑ GPU가 쉬지 않고 일함 (90%+ 활용률)\n```\n\n---\n\n## 🛠️ 핵심 구성 요소\n\n| 구성 요소 | 설명 |\n|---|---|\n| [`continuous_batching`](../03_atomic/continuous_batching.md) | 배치를 실시간으로 재구성하는 연속 배치 처리 엔진 |\n| [`iteration_level_scheduling`](../03_atomic/iteration_level_scheduling.md) | 요청 단위가 아닌 Iteration 단위로 스케줄링하는 정책 |\n| `dynamic_rebalancer` | 배치 내 토큰 길이 불균형 시 재조정하는 내부 로직 |\n\n---\n\n## 🔗 관련 관계\n\n- **COMPOSED_OF**: [`continuous_batching`](../03_atomic/continuous_batching.md), [`iteration_level_scheduling`](../03_atomic/iteration_level_scheduling.md)\n- **PREREQUISITES**: [`composite.static_cache_manager`](static_cache_manager.md) (Module 02), [`composite.autoregressive_loop`](autoregressive_loop.md) (Module 01)\n- **PREREQUISITE_OF**: [`composite.serving_system`](serving_system.md) (Module 03+04 통합)",

    "group": "composite",
    "body": "# Inference Model Pipeline (추론 파이프라인)\n\n## 📌 개념 정의\n\n**Inference Model Pipeline**은 원자적 개념인 [`prefill_phase`](../03_atomic/prefill_phase.md)와 [`decode_phase`](../03_atomic/decode_phase.md)가 결합(`COMPOSED_OF`)하여 입력 프롬프트를 최종 텍스트 응답으로 변환하는 기본 추론 모델 시스템입니다.\n\n---\n\n## 🧱 구조적 파이프라인 (Structural Pipeline)\n\n```\n[입력 프롬프트]\n      │\n      ▼\n┌─────────────────────────────────────────────────────────┐\n│ 1. Prefill Phase (Compute-bound)                        │\n│    - Prompt Processing (Parallel GEMM)                  │\n│    - First Token & Initial KV Cache Build               │\n└─────────────────────────────────────────────────────────┘\n      │\n      ▼\n┌─────────────────────────────────────────────────────────┐\n│ 2. Decode Phase Loop (Memory Bandwidth-bound)           │\n│    - Token-by-Token Autoregressive Generation           │\n│    - Read/Append KV Cache & GEMV Attention              │\n│    - Stop Condition Check (EOS or Max Length)           │\n└─────────────────────────────────────────────────────────┘\n      │\n      ▼\n[최종 생성 텍스트]\n```\n\n---\n\n## 🔗 조립 정보 (Composition & Relationships)\n\n- **COMPOSED_OF**:\n  - [`prefill_phase`](../03_atomic/prefill_phase.md)\n  - [`decode_phase`](../03_atomic/decode_phase.md)\n  - [`inference_only`](../03_atomic/inference_only.md)\n- **PREREQUISITE_OF**:\n  - [`autoregressive_loop`](autoregressive_loop.md) (Module 01)",

    "body": "# PagedAttention Manager (페이지드 어텐션 관리자)\n\n## 📌 개념 정의\n\n**PagedAttention Manager**는 PagedAttention 메커니즘을 구동하기 위한 통합 메모리 컨트롤러로, **물리적 저장소([`paged_kv_cache`](../03_atomic/paged_kv_cache.md))**, **논리-물리 주소 매핑([`block_table`](../03_atomic/block_table.md))**, **토큰-슬롯 인덱서([`slot_mapping`](../03_atomic/slot_mapping.md))**를 결합하여 고성능 GPU 어텐션 연산을 관리합니다.\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITES**: [`atomic.paged_kv_cache`](../03_atomic/paged_kv_cache.md), [`atomic.block_table`](../03_atomic/block_table.md), [`atomic.slot_mapping`](../03_atomic/slot_mapping.md)\n- **COMPOSED_OF**: [`atomic.paged_kv_cache`](../03_atomic/paged_kv_cache.md), [`atomic.block_table`](../03_atomic/block_table.md), [`atomic.slot_mapping`](../03_atomic/slot_mapping.md)\n- **COMPOSES_INTO**: [`module.paged_attention`](../01_module/module_04_paged_attention.md)",

  {
    "id": "composite.serving_system",
    "title": "vLLM 통합 서빙 시스템 (Serving System)",
    "type": "CompositeConcept",
    "path": "concepts/02_composite/serving_system.md",
    "group": "composite",
    "body": "# vLLM 통합 서빙 시스템 (Serving System)\n\n## 📌 개요\n\n**vLLM Serving System**은 Module 3의 **Continuous Batching**과 Module 4의 **PagedAttention**을 하나의 실행 파이프라인으로 통합한 최상위 복합 개념입니다.\n\n- **Module 3 (Continuous Batching)**: GPU가 쉬지 않고 연산하도록 **계산 워크로드(Compute Workload)** 를 최적화합니다.\n- **Module 4 (PagedAttention)**: GPU 메모리를 조각 없이 100% 활용하도록 **메모리 워크로드(Memory Workload)** 를 최적화합니다.\n\n이 두 가지가 함께 작동할 때, vLLM은 기존 시스템 대비 **10~23배의 처리량(Throughput)** 향상을 달성할 수 있습니다.\n\n---\n\n## 🏗️ 통합 아키텍처 (Integrated Architecture)\n\n```\n┌─────────────────────────────────────────────────────────────────────────┐\n│                         [사용자 요청 유입]                              │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────┐\n│ 1. Scheduler (Module 3 - Continuous Batching)                         │\n│    - 대기 큐(Waiting Queue)에서 실행 가능한 요청을 선택               │\n│    - Prefill(Compute-Bound) 우선 정책 적용                            │\n│    - 2단계 스케줄링 (Phase 1: Prefill, Phase 2: Decode)              │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼ (메모리 할당 요청)\n┌─────────────────────────────────────────────────────────────────────────┐\n│ 2. Block Manager (Module 4 - PagedAttention)                          │\n│    - Paged KV Cache를 고정 크기 블록(예: 16 tokens) 단위로 할당      │\n│    - Block Table로 논리적 블록 번호 → 물리적 주소 매핑               │\n│    - Slot Mapping으로 정확한 메모리 위치 계산                         │\n│    - Sequence 종료 시 블록을 즉시 메모리 풀로 반환 (재사용)           │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼ (혼합 배치 구성)\n┌─────────────────────────────────────────────────────────────────────────┐\n│ 3. GPU Execution Engine (Module 3 + 4 협업)                           │\n│    - Continuous Batching으로 Prefill/Decode 혼합 배치 실행            │\n│    - PagedAttention 커널로 불연속적 물리 블록에 저장된 KV Cache 접근   │\n│    - 배치 실행 완료 후 결과 반환 및 배치 해체(Dissolve)               │\n└─────────────────────────────────────────────────────────────────────────┘\n                                    │\n                                    ▼\n┌─────────────────────────────────────────────────────────────────────────┐\n│ 4. 상태 갱신 및 루프 반복                                              │\n│    - 완료된 Sequence는 블록을 Block Manager에 반환                     │\n│    - 진행 중인 Sequence는 Block Table 갱신                             │\n│    - Scheduler가 즉시 다음 배치 구성 (Iteration-Level Scheduling)      │\n└─────────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 🔗 두 모듈의 상호 의존성 (Interdependence)\n\n| 관점 | 설명 |\n|---|---|\n| **Module 3 → Module 4** | Continuous Batching이 **Prefill과 Decode가 혼합된 배치**를 지속적으로 생성합니다. 이 혼합 배치에서 각 요청의 KV Cache는 **동적으로 증가**합니다. PagedAttention은 이 **동적이고 불규칙한** KV Cache 성장을 **효율적으로 관리**하는 방법을 제공합니다. |\n| **Module 4 → Module 3** | PagedAttention의 **블록 단위 할당**은 Scheduler가 **메모리 용량을 정확히 예측**하고 **배치 크기를 최적화**할 수 있게 합니다. 즉, 메모리 관리가 **스케줄링의 의사 결정**을 더 정교하게 만듭니다. |\n\n> 💡 **핵심**: Scheduler는 Block Manager에게 \"이 Sequence에 블록을 몇 개나 할당할 수 있나요?\"라고 묻고, 그 응답에 따라 **배치에 포함시킬 요청의 수를 동적으로 조정**합니다. 이로 인해 메모리 부족(OOM) 없이 GPU를 최대한 활용할 수 있습니다.\n\n---\n\n## 🧱 구성 요소 (Components)\n\n| 구성 요소 | 출처 | 역할 |\n|---|---|---|\n| [`atomic.continuous_batching`](../03_atomic/continuous_batching.md) | Module 3 | 매 Iteration마다 배치를 새롭게 구성 |\n| [`atomic.iteration_level_scheduling`](../03_atomic/iteration_level_scheduling.md) | Module 3 | 요청 단위가 아닌 Iteration 단위 스케줄링 |\n| [`atomic.paged_kv_cache`](../03_atomic/paged_kv_cache.md) | Module 4 | KV Cache를 고정 블록으로 분할 |\n| [`atomic.block_table`](../03_atomic/block_table.md) | Module 4 | 논리→물리 주소 매핑 |\n| [`atomic.slot_mapping`](../03_atomic/slot_mapping.md) | Module 4 | 토큰 위치 → 블록 내 슬롯 변환 |\n| [`composite.paged_attention_manager`](paged_attention_manager.md) | Module 4 | 블록 할당/해제/매핑 총괄 |\n\n---\n\n## 📊 통합 성능 지표 (Combined Impact)\n\n| 지표 | Continuous Batching 단독 | PagedAttention 단독 | **통합 (vLLM)** |\n|---|---|---|---|\n| **GPU 활용률** | 90%+ | 50~70% (메모리 단편화로 인해) | **95%+** |\n| **메모리 활용률** | 70~80% | 100% (단편화 제거) | **~100%** |\n| **처리량 (Throughput)** | 3~5x 향상 | 2~3x 향상 | **10~23x 향상** |\n| **OOM 발생 빈도** | 낮음 | 높음 (연속 할당) | **거의 없음** |\n\n---\n\n## 📝 Brick-by-Brick 학습 관점\n\n이 복합 개념은 지금까지 학습한 모든 개념의 **정점(Peak)** 입니다.\n\n```\n[Module 00] inference_only, prefill_phase, decode_phase\n     │\n     ▼\n[Module 01] kv_cache, attention, ffn, sampling\n     │\n     ▼\n[Module 02] static_kv_cache, seq_len_budget (연속 할당의 한계 인지)\n     │\n     ▼\n[Module 03] continuous_batching, iteration_level_scheduling (계산 효율 극대화)\n     │\n     ▼\n[Module 04] paged_kv_cache, block_table, slot_mapping (메모리 효율 극대화)\n     │\n     ▼\n[Composite] serving_system (Module 3 + 4 통합) ★ **여기까지가 vLLM의 핵심**\n     │\n     ▼\n[Module 5+] memory_pool, prefix_cache, distributed_serving (고급 최적화)\n```\n\n> 💡 **최종 인사이트**: [`serving_system`](serving_system.md)은 단순히 두 모듈을 합친 것이 아닙니다. Scheduler와 Block Manager가 실시간으로 메모리 상태를 주고받으며 **배치 구성을 최적화**하는 **유기적 협업 시스템**입니다. 이 통합이 바로 vLLM이 다른 엔진과 차별화되는 결정적 요인입니다.\n> **Continuous Batching (계산 효율)** 과 **PagedAttention (메모리 효율)** 이 결합되어 vLLM의 완전한 서빙 엔진을 구성하는 방식을 계층적으로 설명합니다.\n\n# PagedAttention Block Manager (페이지드 어텐션 블록 관리자)\n\n## 📌 개요\n\n**PagedAttention Block Manager**는 Module 4의 핵심 복합 개념으로, PagedAttention이 동작하기 위한 **논리-물리 주소 변환 인프라**를 제공합니다.\n\n연속 할당 방식에서는 KV Cache가 단일 연속 메모리 블록으로 존재했기 때문에, Attention 커널은 단순히 `base_address + token_position * head_dim`으로 메모리에 접근할 수 있었습니다.\n\n그러나 PagedAttention에서는 KV Cache가 **수십 개의 불연속적인 물리적 블록**에 흩어져 저장됩니다. 이 복잡성을 Attention 커널로부터 숨기고, **논리적으로는 연속적인 캐시처럼 보이게** 하는 것이 이 Block Manager의 핵심 역할입니다.\n\n---\n\n## 🧱 구성 요소 (Components)\n\n| 구성 요소 | 설명 |\n|---|---|\n| [`atomic.paged_kv_cache`](../03_atomic/paged_kv_cache.md) | KV Cache를 고정 크기 블록(예: 16 tokens) 단위로 물리적 메모리에 분산 저장 |\n| [`atomic.block_table`](../03_atomic/block_table.md) | 각 Sequence별로 `Logical Block ID → Physical Block ID`를 매핑하는 테이블 |\n| [`atomic.slot_mapping`](../03_atomic/slot_mapping.md) | 특정 토큰 위치(`token_position`)를 `(physical_block_id, slot_index)` 쌍으로 변환하는 계산기 |\n\n---\n\n## 🏗️ 아키텍처 및 동작 원리\n\n### 1. 논리적 캐시 vs 물리적 캐시\n\nBlock Manager는 Sequence가 인식하는 **논리적 캐시(Logical Cache)** 와 GPU 메모리에 실제로 저장된 **물리적 캐시(Physical Cache)** 를 분리합니다.\n\n```\n[Sequence가 인식하는 논리적 캐시]\n┌──────────────────────────────────────────────────────┐\n│ Logical Block 0 │ Logical Block 1 │ Logical Block 2 │\n│ (Token 0~15)    │ (Token 16~31)   │ (Token 32~47)   │\n└──────────────────────────────────────────────────────┘\n         │                │                │\n         ▼ (Block Table 매핑)\n┌──────────────────────────────────────────────────────┐\n│ Physical Block 7 │ Physical Block 3 │ Physical Block 15│\n│ (GPU 메모리)     │ (GPU 메모리)     │ (GPU 메모리)      │\n└──────────────────────────────────────────────────────┘\n```\n\n### 2. Block Table (블록 테이블)\n\n각 Sequence는 자신만의 Block Table을 유지합니다. 이 테이블은 **논리적 블록 번호**를 키로, **물리적 블록 주소(또는 ID)** 를 값으로 저장합니다.\n\n```\nSequence A의 Block Table (BLOCK_SIZE = 16):\n┌─────────────────┬──────────────────┐\n│ Logical Block 0 │ Physical Block 7 │\n│ Logical Block 1 │ Physical Block 3 │\n│ Logical Block 2 │ Physical Block 15│\n│ Logical Block 3 │ Physical Block 22│\n└─────────────────┴──────────────────┘\n\nSequence B의 Block Table:\n┌─────────────────┬──────────────────┐\n│ Logical Block 0 │ Physical Block 5 │\n│ Logical Block 1 │ Physical Block 11│\n└─────────────────┴──────────────────┘\n```\n\n### 3. Slot Mapping (슬롯 매핑)\n\nAttention 커널이 특정 토큰의 K/V 텐서를 읽어야 할 때, Block Manager는 **토큰 위치 → 물리적 블록 내 슬롯**을 계산합니다.\n\n**매핑 공식**:\n\n```\nlogical_block_id  = token_position // BLOCK_SIZE\nphysical_block_id = block_table[logical_block_id]\nslot_index        = token_position % BLOCK_SIZE\n```\n\n**예시** (`BLOCK_SIZE = 16`, Sequence A 기준):\n\n| Token Position | logical_block_id | physical_block_id | slot_index |\n|---|---|---|---|\n| 0 | 0 | 7 | 0 |\n| 15 | 0 | 7 | 15 |\n| 16 | 1 | 3 | 0 |\n| 31 | 1 | 3 | 15 |\n| 32 | 2 | 15 | 0 |\n\n> 💡 Attention 커널은 `physical_block_id * BLOCK_SIZE * head_dim + slot_index * head_dim` 오프셋으로 메모리에서 K/V를 읽어옵니다.\n\n---\n\n## 🔗 Module 3 Scheduler와의 협업\n\nBlock Manager는 단순히 매핑만 수행하는 것이 아니라, **Scheduler(Module 3)와 긴밀히 협력**하여 메모리 상태를 실시간으로 공유합니다.\n\n| 협업 포인트 | 설명 |\n|---|---|\n| **가용 블록 조회** | Scheduler가 `get_num_free_blocks()`를 호출하여 현재 할당 가능한 블록 수를 확인 |\n| **배치 크기 결정** | 가용 블록 수가 부족하면 Scheduler는 배치에 포함시킬 요청 수를 동적으로 축소 |\n| **메모리 할당 요청** | Scheduler가 새 Sequence를 배치에 추가할 때, Block Manager에게 필요한 블록 수만큼 할당 요청 |\n| **메모리 해제 알림** | Sequence가 완료되면 Scheduler가 Block Manager에게 해당 블록들을 해제하도록 지시 |\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│ Scheduler (Module 3)                                       │\n│  - \"지금 5개 블록이 필요해\" → Block Manager에 요청          │\n└─────────────────────────────────────────────────────────────┘\n                           │\n                           ▼ (메모리 상태 확인)\n┌─────────────────────────────────────────────────────────────┐\n│ Block Manager (Module 4)                                   │\n│  - \"현재 3개 블록밖에 없어. 2개는 Swap Manager로 보낼게.\"  │\n└─────────────────────────────────────────────────────────────┘\n                           │\n                           ▼ (스왑 완료 후)\n┌─────────────────────────────────────────────────────────────┐\n│ Scheduler (Module 3)                                       │\n│  - \"확인. 5개 블록 할당받았으니 배치 구성 완료.\"            │\n└─────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 📊 Block Manager의 성능 기여\n\n| 지표 | 연속 할당 방식 | PagedAttention (Block Manager 적용) |\n|---|---|---|\n| **메모리 접근 방식** | 연속적 (Contiguous) | 불연속적 (Non-Contiguous) |\n| **주소 변환 오버헤드** | 없음 (직접 오프셋 계산) | 약간 있음 (Block Table Lookup + Slot Calc) |\n| **메모리 단편화** | 심각 (External Fragmentation) | **거의 제로 (Near-Zero)** |\n| **Attention 커널 복잡도** | 낮음 | 중간 (불연속 메모리 읽기 지원 필요) |\n| **전체 시스템 처리량** | 1x (기준) | **10~23x 향상** |\n\n> ⚠️ **주의**: Block Manager의 주소 변환은 약간의 오버헤드를 유발하지만, 이는 **메모리 단편화 제거로 인한 이득(10~23배 처리량 향상)에 비해 무시할 수 있는 수준**입니다.\n\n---\n\n## 🧠 블록 관리자의 상태 추적 (State Tracking)\n\nBlock Manager는 내부적으로 다음 상태들을 지속적으로 추적합니다.\n\n```python\n# Block Manager 내부 상태 (개념적)\nclass PagedAttentionBlockManager:\n    # Sequence ID → Block Table\n    block_tables: Dict[SeqID, List[PhysicalBlockID]]\n    \n    # Physical Block ID → (Sequence ID, Logical Block ID) 역매핑 (디버깅/해제용)\n    reverse_mapping: Dict[PhysicalBlockID, Tuple[SeqID, LogicalBlockID]]\n    \n    # 사용 가능한 물리적 블록 목록 (Free List)\n    free_blocks: List[PhysicalBlockID]\n    \n    # 전체 블록 개수 (GPU Memory Pool 크기)\n    total_blocks: int\n```\n\n---\n\n## 📝 Brick-by-Brick 학습 관점\n\nModule 4의 Block Manager는 지금까지 학습한 개념들 중 **가장 실용적인 추상화 계층**입니다.\n\n```\n[Module 1] KV Cache 존재 인지\n     │\n     ▼\n[Module 2] 연속 할당의 한계(단편화) 인지\n     │\n     ▼\n[Module 3] Continuous Batching (계산 효율 극대화)\n     │\n     ▼\n[Module 4] PagedAttention (논리-물리 분리 개념 도입) ★\n     │\n     ▼\n[Module 4 Block Manager] ★★★★★\n     - Block Table 관리\n     - Slot Mapping 계산\n     - Scheduler와 메모리 상태 공유\n     - Attention 커널에 불연속 메모리 접근 인터페이스 제공\n     │\n     ▼\n[Module 5] Memory Pool / Allocator / Swap Manager (운영 인프라 확장)\n```\n\n> 💡 **최종 인사이트**: Module 4의 Block Manager는 PagedAttention이라는 **혁신적인 아이디어**와 실제 GPU 커널이 동작하는 **구현 계층(Implementation Layer)** 사이의 **번역기(Translator)** 역할을 합니다. 이 관리자가 없으면 PagedAttention은 이론에 그치고, Attention 커널은 불연속 메모리를 읽을 수 없어 시스템이 동작하지 않습니다. 바로 이 계층이 vLLM을 **\"논문의 아이디어\"**에서 **\"실제로 동작하는 시스템\"**으로 전환시키는 마법 같은 접착제입니다.",

    "id": "composite.static_cache_manager",
    "title": "Static Cache Manager (정적 KV 캐시 관리자)",
    "type": "CompositeConcept",
    "path": "concepts/02_composite/static_cache_manager.md",
    "group": "composite",
    "body": "# Static Cache Manager (정적 KV 캐시 관리자)\n\n## 📌 개념 정의\n\n**Static Cache Manager**는 [`static_kv_cache`](../03_atomic/static_kv_cache.md) (연속된 정적 버퍼)와 [`seq_len_budget`](../03_atomic/seq_len_budget.md) (시퀀스 길이 예산 정책)을 결합한 기초 캐시 관리 컴포넌트입니다.  \n**Module 02**에서 다루는 개념으로, PagedAttention(Module 04) 이전의 1세대 KV Cache 관리 방식을 구현합니다.\n\n> 🚨 **주의: Static Batching과 혼동하지 마십시오!**  \n> 이 문서는 **\"Static KV Cache\" (메모리 할당 방식)**에 대한 설명입니다.  \n> **\"Static Batching\" (정적 배치 처리 방식)**은 [`composite.dynamic_batcher`](dynamic_batcher.md) 문서에서 다룹니다.  \n> 두 개념은 완전히 다르며, 이름이 비슷하지만 전혀 다른 계층(Layer)의 최적화입니다.\n\n---\n\n## 🧱 컴포넌트 메커니즘\n\n```\n[New Key, Value Tensor (1 Token)]\n              │\n              ▼\n┌─────────────────────────────────────────────────────────┐\n│ Static Cache Manager                                    │\n│  1. Check seq_len_budget limit (예산 초과 여부 확인)    │\n│  2. Insert K,V to static_kv_cache buffer at current_pos │\n│  3. Increment current_pos pointer (포인터 증가)         │\n│  4. Return valid slice buffer for Attention computation │\n└─────────────────────────────────────────────────────────┘\n              │\n              ▼\n[Valid Key/Value Slice Matrix for Attention]\n```\n\n### 1. Static KV Cache (정적 KV 캐시)\n- 시스템 초기화 시 `max_seq_len`에 해당하는 **연속된(Contiguous) 메모리 버퍼**를 GPU에 사전 할당(Pre-allocate)합니다.\n- 디코드 단계에서 새 토큰의 K/V 텐서가 들어오면, 현재 위치(`current_pos`)에 덮어쓰거나 추가(Append)합니다.\n- **장점**: 메모리 할당/해제 오버헤드가 없고, 포인터 연산이 단순합니다.\n- **단점**: **외부 단편화(External Fragmentation)**가 발생하고, 실제 사용량보다 큰 메모리를 점유하여 낭비(Internal Fragmentation)가 심합니다.\n\n### 2. Seq Length Budget (시퀀스 길이 예산)\n- 각 요청이 생성할 수 있는 최대 토큰 수(`max_tokens`)를 제한합니다.\n- 버퍼 오버플로우(Overflow)를 방지하고, 시스템 메모리를 보호하는 안전 장치(Safety Guard)입니다.\n\n---\n\n## 🔗 조립 정보 (Composition & Relationships)\n\n- **COMPOSED_OF**:\n  - [`atomic.static_kv_cache`](../03_atomic/static_kv_cache.md)\n  - [`atomic.seq_len_budget`](../03_atomic/seq_len_budget.md)\n- **PREREQUISITES**:\n  - [`composite.autoregressive_loop`](autoregressive_loop.md) (Module 01)\n- **PREREQUISITE_OF**:\n  - [`composite.dynamic_batcher`](dynamic_batcher.md) (Module 03)\n\n---\n\n## ⚠️ Static Cache Manager의 한계 (PagedAttention으로의 연결)\n\n이 관리자는 구현이 단순하고 빠르지만, 다음과 같은 치명적 한계로 인해 **Module 04 (PagedAttention)**에서 대체됩니다.\n1. **외부 단편화**: Sequence 종료 후 해제된 공간이 조각(Fragment)으로 남아 메모리 활용률이 50~70%에 그칩니다.\n2. **확장성 부족**: 긴 프롬프트나 대규모 배치 처리 시 메모리 낭비가 심각해집니다.\n3. **OOM 취약**: 연속된 큰 메모리 블록을 찾지 못해 Out Of Memory 오류가 빈번히 발생합니다.\n\n> 💡 **다음 학습 단계**: Module 04의 [`composite.paged_attention_manager`](paged_attention_manager.md)에서 이 문제를 어떻게 해결하는지 학습하세요.",
    "frontmatter": {

      "description": "Static KV Cache 버퍼(연속 할당)와 Sequence Length Budget 정책을 통합하여, 토큰 Append 및 어텐션 슬라이스 생성을 총괄하는 1세대 캐시 관리 엔진. (Static Batching과는 무관)",

    "id": "atomic.attention",
    "title": "Scaled Dot-Product Attention (어텐션 메커니즘)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/attention.md",
    "group": "atomic",
    "body": "# Scaled Dot-Product Attention (어텐션 메커니즘)\n\n## 📌 개념 정의\n\n**Scaled Dot-Product Attention**은 트랜스포머 아키텍처의 핵심 연산으로, 입력 시퀀스 토큰 간의 관련성을 계산하여 문맥 정보를 융합합니다.\n\n$$\\text{Attention}(Q, K, V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$$\n\n- **Prefill 단계**: $Q, K, V$ 모두 전체 프롬프트 시퀀스 길이를 가져 병렬 GEMM 연산 수행\n- **Decode 단계**: $Q$는 길이 1이며, $K, V$는 KV Cache에 보관된 전체 과거 시퀀스와 어텐션 연산(GEMV) 수행\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITE_OF**:\n  - [`decoder_layer`](../02_composite/decoder_layer.md)",

    "type": "AtomicConcept",

    "group": "atomic",
    "body": "# Block Allocator (블록 할당기)\n\n## 📌 개념 정의\n**Block Allocator**는 [`memory_pool`](memory_pool.md)에서 미리 할당된 고정‑크기 메모리 블록을 **시점‑기반**으로 가져오고 반환하는\n책임을 진다.\n- **대기열 없이 즉시 할당**: 배치가 시작될 때 즉시 사용 가능한 블록을 제공.\n- **단순 해제**: 사용이 끝난 블록을 풀에 되돌려 재사용을 보장.\n\n## ⚙️ 핵심 메서드\n- `allocate()` → 사용 가능한 가장 작은 블록 반환.\n- `free(block_id)` → 블록을 풀에 반환, 재사용 대기.\n\n## 🔗 관련 관계\n- **PREREQUISITES**: [`memory_pool`](memory_pool.md)\n- **PREREQUISITE_OF**: [`swap_manager`](swap_manager.md) (스와핑 지원)",

    "title": "Block Table (블록 테이블)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/block_table.md",
    "group": "atomic",
    "body": "# Block Table (블록 테이블)\n\n## 📌 개념 정의\n\n**Block Table**은 Virtual Memory 시스템의 Page Table과 같이, 각 Sequence의 **논리적 블록 번호(Logical Block Number)**를 GPU HBM 상에 분산 저장된 **물리적 블록 ID(Physical Block ID)**에 매핑해주는 자료구조입니다.\n\n- Sequence의 토큰들이 물리적으로 불연속한 블록들에 저장되더라도, Block Table을 통해 연속적인 시퀀스로 참조할 수 있습니다.\n- Prefix Caching이나 Prompt Sharing 시 여러 Sequence가 동일한 물리적 블록을 공유할 수 있도록 해줍니다.\n\n---\n\n## 🧱 논리-물리 매핑 예시\n\n```\nSequence A Block Table:\n┌─────────────────┬──────────────────┐\n│ Logical Block 0 │ Physical Block 7 │\n│ Logical Block 1 │ Physical Block 3 │\n│ Logical Block 2 │ Physical Block 22│\n└─────────────────┴──────────────────┘\n```\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITES**: [`atomic.paged_kv_cache`](paged_kv_cache.md)\n- **COMPOSES_INTO**: [`composite.paged_attention_manager`](../02_composite/paged_attention_manager.md)\n- **SYNERGY WITH**: [`atomic.slot_mapping`](slot_mapping.md)",

    "id": "atomic.cache_hit_detection",
    "title": "Cache Hit Detection (캐시 히트 탐지)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/cache_hit_detection.md",
    "group": "atomic",
    "body": "# Cache Hit Detection (캐시 히트 탐지)\n\n## 📌 개념 정의\n**Cache Hit Detection**은 요청이 들어올 때 **프리픽스**를 해시화하고 기존 캐시와 매칭시켜 **히트 여부**를\n판단한다.\n- **히트** → 저장된 KV/hidden 상태를 로드하고 바로 진행.\n- **미스** → 프리패딩을 수행하고 새 프리픽스와 결과를 캐시에 삽입.\n\n## ⚙️ 핵심 알고리즘\n```pseudo\nfunction detect_hit(request_prefix):\n    h = hash(request_prefix)\n    if h in cache_table:\n        return (True, cache_table[h])\n    else:\n        return (False, None)\n\n• 해시 충돌 방지: SHA‑256 기반 해시와 충돌 시 검증 단계(실제 토큰 비교) 수행.\n## 🔗 관련 관계\n\n• PREREQUISITES: prefix_cache\n• COMPOSED_OF: caching_strategy (전략 선택)",

    "body": "# Continuous Batching (연속 배치)\n\n## 📌 개념 정의\n**Continuous Batching**은 요청이 들어올 때마다 현재 실행 중인 배치에 바로 삽입하거나, 배치가 완료되면 새로운 배치를 시작하는 방식으로, 전통적인 고정 배치와 달리 **동적인 배치 결합**을 제공합니다.\n\n## ⚙️ 핵심 요소\n- [`continuous_batching`](continuous_batching.md) – 배치 결합 로직 및 토큰 길이 기반 동적 병합\n- [`max_batch_size`](max_batch_size.md) – 하드웨어 제한에 따른 최대 배치 크기 (예: 2048 토큰)\n- [`length_aware_scheduler`](length_aware_scheduler.md) – 토큰 길이와 연산량을 고려해 배치를 스케줄링하는 스케줄러\n\n## 🔗 선행 관계\n- **PREREQUISITES**: [`kv_cache`](kv_cache.md) (기본 KV 캐시 엔진)\n- **PREREQUISITE_OF**: [`iteration_level_scheduling`](iteration_level_scheduling.md) (배치 단계 스케줄링)\n\n## 📚 참고 자료\n- Sarathi‑Serve 지속 배치 구현\n- vLLM 연속 배치 논문",

    "path": "concepts/03_atomic/decode_phase.md",
    "group": "atomic",
    "body": "# Decode Phase (디코드 단계)\n\n## 📌 개념 정의\n\n**Decode Phase**(또는 Token Generation Phase)는 Prefill Phase 이후 `EOS(End of Sequence)` 토큰이 나오거나 최대 생성 길이에 도달할 때까지 토큰을 1개씩 자기회귀(Autoregressively) 방식으로 반복 생성하는 단계입니다.\n\n이 단계는 다음과 같은 기술적 특징을 가집니다:\n1. **Sequential Token-by-Token Generation**: 이전 스텝에서 생성된 토큰 단 1개만 입력으로 사용함.\n2. **Memory Bandwidth-Bound Operation**: 매 스텝마다 전체 모델 가중치(Weights)와 누적된 KV 캐시를 GPU HBM에서 SRAM으로 불러와야 하므로 메모리 대역폭(GB/s)이 주 병목임.\n3. **KV Cache Traversal**: 새 토큰의 K, V 벡터 1개를 계산한 후, 기존 저장된 전체 KV 캐시와 어텐션 연산(GEMV)을 수행함.\n\n---\n\n## 📐 연산 차원 (Tensor Shape)\n\n- **Input Tensor Shape**: `[Batch Size, 1, Hidden Size]`\n- **Attention Map Matrix**: `[Batch Size, Num Heads, 1, Current Seq Length]`\n- **Updated KV Cache Shape**: `[Batch Size, Num Heads, Current Seq Length, Head Dim]`\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITES**:\n  - [`prefill_phase`](prefill_phase.md)\n- **PREREQUISITE_OF**:\n  - [`inference_model`](../02_composite/inference_model.md)",

    "id": "atomic.distributed_kv",
    "title": "Distributed KV Cache (분산 KV 캐시)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/distributed_kv.md",
    "group": "atomic",
    "body": "# Distributed KV Cache (분산 KV 캐시)\n\n## 📌 개념 정의\n\n**Distributed KV Cache**는 Tensor Parallelism(TP) 환경에서 **KV Cache 또한 GPU 수에 따라 분할(Shard)** 하여 관리하는 기법입니다.\n\n단일 GPU에서는 모든 KV Heads(예: 32개)를 하나의 GPU가 관리했지만, TP 환경에서는 각 GPU가 자신이 담당하는 KV Heads만 관리합니다.\n\n## ⚙️ 핵심 구성 요소\n\n| 컴포넌트 | 역할 |\n|----------|------|\n| **Partitioner** | 입력 키를 해시하고, `hash(key) % N` 로 파티션(샤드) 번호 결정 |\n| **Replica Manager** | 각 파티션을 1+개의 복제본에 저장, 리더‑팔로워 동기화 |\n| **Meta Service** | 파티션‑노드 매핑, 리더 선출, 헬스 체크 정보를 중앙 관리 |\n| **Consistency Layer** | 읽기/쓰기 일관성 모델 제공 (Strong, Eventual, Read‑After‑Write 등) |\n| **Load Balancer** | 클라이언트 요청을 적절한 KV 인스턴스로 라우팅 (다음 파일 `load_balancer.md` 참고) |\n| **Fault Tolerance** | 노드 장애 감지 → 자동 리플리케이션 재배치 (다음 파일 `fault_tolerance.md` 참고) |\n\n## 🚀 주요 동작 흐름\n\n1. **쓰기**\n   - 클라이언트 → Load Balancer → `Partitioner` 로 파티션 결정\n   - 메타 서비스가 해당 파티션의 **리더** 노드(Primary) 식별\n   - 리더에 쓰기 → 복제본(Secondary)에게 **동기식/비동기식** 복제 전파\n2. **읽기**\n   - 클라이언트 → Load Balancer → `Partitioner` 로 파티션 결정\n   - 메타 서비스가 **리더** 혹은 **팔로워** 중 일관성 요구에 맞는 노드 선택\n   - 선택된 노드에서 데이터 반환\n3. **노드 장애**\n   - 헬스 체크 실패 → `Fault Tolerance` 가 새로운 리더 선출 및 복제 재배치\n   - 메타 서비스가 파티션‑노드 매핑을 업데이트하고 Load Balancer에 전파\n\n## 🧩 KV Heads Sharding 예시\n\n**가정**: `num_kv_heads = 8`, `tensor_parallel_size = 4`\n\n| GPU (Rank) | 담당 KV Heads | KV Cache 블록 할당 |\n|---|---|---|\n| GPU 0 (Rank 0) | Head 0, 1 | 자신의 Memory Pool에서 블록 할당 |\n| GPU 1 (Rank 1) | Head 2, 3 | 자신의 Memory Pool에서 블록 할당 |\n| GPU 2 (Rank 2) | Head 4, 5 | 자신의 Memory Pool에서 블록 할당 |\n| GPU 3 (Rank 3) | Head 6, 7 | 자신의 Memory Pool에서 블록 할당 |\n\n## 🔄 동작 방식 (Decode Phase 기준)\n\n1. **Prefill 단계**: 각 GPU가 자신에게 할당된 KV Heads에 대해서만 K, V 텐서를 계산하고, 자신의 Memory Pool에 저장합니다.\n2. **Decode 단계 (Attention)**:\n   - 각 GPU는 자신의 KV Cache(일부 Heads)를 읽어 부분 어텐션(Partial Attention)을 계산합니다.\n   - **All-Reduce**를 통해 모든 GPU의 부분 어텐션 결과를 합산하여 최종 Attention 출력을 생성합니다.\n\n## 📊 메모리 용량 확장 효과\n\n| 구성 | 단일 GPU KV Cache 용량 | 총 분산 용량 |\n|---|---|---|\n| TP=1 | 80GB × 1 = 80GB | 80GB |\n| TP=4 | 80GB × 4 = 320GB (실제: 각 GPU가 80GB씩 담당) | **320GB** |\n| TP=8 | 80GB × 8 = 640GB | **640GB** |\n\n> 💡 **핵심 이점**: Distributed KV Cache는 **메모리 용량을 GPU 수에 비례하여 선형적으로 확장**합니다. 즉, TP=4를 사용하면 동시에 처리할 수 있는 최대 Sequence 길이 또는 배치 크기가 단일 GPU 대비 4배 증가합니다.\n\n## ⚠️ 통신 오버헤드\n\n- Decode 단계에서 Attention 결과를 동기화하기 위해 **매 Iteration마다 All-Reduce**가 발생합니다.\n- KV Cache 자체는 NCCL 통신 없이 각 GPU가 독립적으로 관리하므로, 통신량은 Attention 결과 텐서 크기( `batch_size * seq_len * hidden_dim` )에 비례합니다.\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITES**: [`kv_cache`](kv_cache.md), [`atomic.paged_kv_cache`](paged_kv_cache.md), [`atomic.nccl_communicator`](nccl_communicator.md)\n- **PREREQUISITE_OF**: [`load_balancer`](load_balancer.md), [`fault_tolerance`](fault_tolerance.md), [`composite.distributed_serving`](../02_composite/distributed_serving_system.md)",

  {
    "id": "atomic.fault_tolerance",
    "title": "Fault Tolerance (장애 내성)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/fault_tolerance.md",
    "group": "atomic",
    "body": "# Fault Tolerance (장애 내성)\n\n## 📌 개념 정의\n**Fault Tolerance**는 **노드 장애**, **네트워크 파편화**, **서버 재시작** 등 다양한 오류 상황에서도 **분산 KV\n시스템**이 지속적으로 동작하도록 보장하는 메커니즘이다. 핵심 목표는\n1. **서비스 중단 최소화** (Zero‑downtime)\n2. **데이터 손실 방지** (Strong durability)\n3. **자동 복구** (Self‑healing)\n\n## ⚙️ 주요 구성 요소\n| 구성 요소 | 역할 |\n|-----------|------|\n| **Health Checker** | 각 KV 인스턴스에 주기적인 `ping/heartbeat` 전송, 응답 지연·실패를 감지 |\n| **Leader Election** | 장애 발생 시 새로운 리더(Primary) 선출 – Raft, ZooKeeper, etcd 등 사용 |\n| **Replica Rebalancer** | 복제본 수가 부족해지면 다른 정상 노드에 새 복제본을 생성 |\n| **Failover Router** | Load Balancer가 장애 노드 대신 새로운 리더/복제본으로 트래픽 전환 |\n| **Consensus Log** | 장애 전후 상태 변화를 로그에 기록해 일관성 및 복구 시점 결정 |\n| **Graceful Degradation** | 일시적 장애 시 읽기‑전용 모드 혹은 캐시‑우선 모드 전환 |\n\n## 🚀 동작 흐름\n1. **헬스 체크** – `Health Checker` 가 노드 응답을 모니터링.\n2. **장애 탐지** – 연속된 타임아웃 또는 오류율 초과 시 “장애”로 판단.\n3. **리더 재선출** – 현재 파티션의 리더가 다운되면 `Leader Election` 알고리즘이 새로운 리더를 선정한다.\n4. **복제 재배치** – `Replica Rebalancer` 가 부족한 복제본을 다른 가용 노드에 복제한다.\n5. **트래픽 전환** – `Failover Router` 가 로드 밸런서 설정을 업데이트해 요청을 새로운 리더/복제본으로 라우팅한다.\n6. **복구 완료** – 복구가 종료되면 `Consensus Log` 에 상태를 기록하고 정상 모드(`Read‑Write`) 로 복귀한다.\n\n## 📐 일관성 옵션\n- **Strong Consistency** – 리더 재선출 후, 새로운 리더와 기존 복제본 모두가 최신 로그를 확보할 때까지 쓰기를 일시\n중단.\n- **Eventual Consistency** – 장애 중에도 읽기·쓰기를 허용하고, 복구 시 백그라운드 동기화 수행.\n\n## 🔗 관련 관계\n- **PREREQUISITES**: [`distributed_kv`](distributed_kv.md), [`load_balancer`](load_balancer.md)\n- **PREREQUISITE_OF**: [`composite.distributed_serving`](../02_composite/distributed_serving_system.md) (전체 서비스 레이어에서 장애 내성을 활용)",

    "type": "AtomicConcept",
    "path": "concepts/03_atomic/ffn.md",
    "group": "atomic",
    "body": "# Feed-Forward Network (FFN / MLP)\n\n## 📌 개념 정의\n\n**Feed-Forward Network (FFN)** 또는 MLP(Multi-Layer Perceptron) 블록은 어텐션 결과 텐서를 받아 각 토큰별로 비선형 투영(Projection) 및 차원 확장을 수행하는 레이어입니다.\n\n최근 LLM(Llama, Mistral 등)에서는 SwiGLU 또는 GELU 활성화 함수 기반 3개의 선형 레이어(Gate, Up, Down Projection)로 구성됩니다.\n\n$$\\text{FFN}(x) = (\\text{Swish}(xW_{\\text{gate}}) \\odot xW_{\\text{up}}) W_{\\text{down}}$$\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITE_OF**:\n  - [`decoder_layer`](../02_composite/decoder_layer.md)",

  {
    "id": "atomic.inference_only",
    "title": "Inference-Only Workload (추론 전용 워크로드)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/inference_only.md",
    "group": "atomic",
    "body": "# Inference-Only Workload (추론 전용 워크로드)\n\n## 📌 개념 정의\n\n**Inference-Only Workload**는 이미 학습 완료된 LLM 모델 파라미터를 고정(Freeze)한 상태에서 입력 텍스트에 대한 Forward Pass만을 수행하는 작업입니다.\n\n학습(Training) 단계와 비교했을 때 다음과 같은 핵심 차이점이 존재합니다:\n1. **No Gradient Accumulation**: 역전파(Backpropagation)를 위한 활성화 값(Activation) 저장이 불필요함.\n2. **Deterministic Weights**: 모델 가중치(Weights)가 불변(Immutable) 상태로 메모리에 유지됨.\n3. **KV Cache Dependency**: 이전 단계 토큰들의 연산 재사용을 위해 KV 캐시 관리가 핵심 성능 병목 요소로 작용함.\n\n---\n\n## 📊 연산 특성 비교\n\n| 구분 | Training | Inference-Only |\n|---|---|---|\n| **Pass** | Forward + Backward Pass | Forward Pass Only |\n| **Memory Bottleneck** | Activation memory + Optimizer States | Model Weights + KV Cache |\n| **Compute Pattern** | Large GEMM operations | GEMM (Prefill) + GEMV (Decode) |\n| **Batching Strategy** | Static Uniform Batching | Dynamic Continuous Batching |\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITE_OF**:\n  - [`prefill_phase`](prefill_phase.md)\n  - [`decode_phase`](decode_phase.md)",

    "id": "atomic.kv_cache",
    "title": "Key-Value Cache (KV 캐시)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/kv_cache.md",
    "group": "atomic",
    "body": "# Key-Value Cache (KV 캐시)\n\n## 📌 개념 정의\n\n**KV Cache**는 자기회귀(Autoregressive) 텍스트 생성 과정에서 이미 계산된 이전 토큰들의 Key($K$) 및 Value($V$) 텐서를 메모리에 저장하고, 매 디코드 스텝마다 신규 토큰의 $K, V$만 새로 계산하여 기존 캐시에 병합(Append)하는 기술입니다.\n\nKV Cache가 없을 경우 $t$번째 토큰을 생성할 때 1부터 $t-1$번째 토큰까지의 어텐션을 매번 처음부터 재계산해야 하므로, 복잡도가 $O(N^2)$에서 $O(N)$으로 획기적으로 줄어듭니다.\n\n---\n\n## 📐 KV Cache 텐서 예시\n\n- **Key Cache Shape**: `[Batch Size, Num Key Heads, Current Seq Length, Head Dim]`\n- **Value Cache Shape**: `[Batch Size, Num Key Heads, Current Seq Length, Head Dim]`\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITES**:\n  - [`prefill_phase`](prefill_phase.md)\n  - [`decode_phase`](decode_phase.md)\n- **PREREQUISITE_OF**:\n  - [`autoregressive_loop`](../02_composite/autoregressive_loop.md)\n  - [`static_kv_cache`](static_kv_cache.md) (Module 02)\n  - [`paged_kv_cache`](paged_kv_cache.md) (Module 04)",

    "id": "atomic.length_aware_scheduler",
    "title": "Length Aware Scheduler (길이‑인식 스케줄러)",

    "group": "atomic",
    "body": "# Length Aware Scheduler (길이‑인식 스케줄러)\n\n## 📌 개념 정의\n**Length‑Aware Scheduler**는 각 요청의 토큰 길이와 예상 연산량을 기반으로 배치에 할당할 우선순위를 결정합니다.\n- 짧은 요청은 빠르게 처리되어 레이턴시를 감소시킵니다.\n- 긴 요청은 GPU 메모리 한계에 맞춰 적절히 분할하거나 대기열에 배치됩니다.\n\n## ⚙️ 핵심 동작\n- **길이 기반 가중치**: `weight = 1 / token_length` 로 우선순위 계산.\n- **자원 사용량 체크**: 현재 배치의 추정 메모리 사용량이 [`max_batch_size`](max_batch_size.md) 를 초과하면 새 배치를 시작합니다.\n- **동적 재배치**: 실행 중인 배치에 새로운 짧은 요청이 들어오면 즉시 삽입하고, 긴 요청은 다음 배치에 할당합니다.\n\n## ⚙️ 핵심 요소\n- [`length_aware_scheduler`](length_aware_scheduler.md) – 토큰 길이와 연산량 기반 스케줄링 로직  \n- [`max_batch_size`](max_batch_size.md) – 하드웨어 제한에 따른 배치 상한 (예: 2048 토큰) \n\n## 🔗 선행 관계\n- **PREREQUISITES**: [`continuous_batching`](continuous_batching.md)  \n- **PREREQUISITE_OF**: [`dynamic_batcher`](../02_composite/dynamic_batcher.md) (Composite Concept, Module 03)\n- **COMPOSED_OF**: [`max_batch_size`](max_batch_size.md) (Maximum batch size parameter)\n\n## 📚 참고 자료\n- Sarathi‑Serve 연속 배치 구현  \n- vLLM 연속 배치 논문",

    "id": "atomic.load_balancer",
    "title": "Load Balancer (로드 밸런서)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/load_balancer.md",
    "group": "atomic",
    "body": "# Load Balancer (로드 밸런서)\n\n## 📌 개념 정의\n**Load Balancer**는 **클라이언트 요청**을 여러 **Distributed KV** 인스턴스로 라우팅하여 부하를 균등하게 분산한다.\n주요 방식:\n- **라운드‑로빈 (Round‑Robin)**\n- **가중 라운드‑로빈 (Weighted RR)** – 인스턴스 성능에 따라 가중치 부여\n- **최소 연결 (Least Connections)** – 현재 연결 수가 가장 적은 인스턴스로 전달\n- **헬스 체크** – 비활성 인스턴스 자동 제외\n\n## ⚙️ 핵심 흐름\n1. **헬스 체크** – 주기적으로 각 KV 노드 상태 확인 (`ping`, `heartbeat`).\n2. **라우팅 정책 적용** – 라우팅 알고리즘에 따라 대상 노드 선택.\n3. **프록시 전달** – 선택된 노드에 HTTP/gRPC/JSON‑RPC 등 프로토콜로 요청 전달.\n4. **응답 반환** – 노드 응답을 클라이언트에 바로 전달.\n\n## 🔗 관련 관계\n- **PREREQUISITES**: [`distributed_kv`](distributed_kv.md)\n- **PREREQUISITE_OF**: [`fault_tolerance`](fault_tolerance.md) (장애 시 재시도·전환)",
