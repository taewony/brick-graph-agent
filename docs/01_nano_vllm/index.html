  {
    "id": "atomic.master_worker",
    "title": "Master-Worker Execution Pattern (마스터-워커 실행 패턴)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/master_worker.md",
    "group": "atomic",
    "body": "# Master-Worker Execution Pattern (마스터-워커 실행 패턴)\n\n## 📌 개념 정의\n\n**Master-Worker 패턴**은 분산 시스템에서 단일 **Master (Rank 0)**가 전체 워크플로우를 조정하고, 여러 **Worker (Rank 1..N)**들이 Master의 지시에 따라 실제 GPU 연산을 수행하는 동기식(Synchronous) 실행 모델입니다.\n\nnano-vLLM/vLLM에서 이 패턴은 `torch.distributed`의 **Rank** 개념을 기반으로 동작합니다.\n\n## 🏗️ 역할 분담 (Role Distribution)\n\n| 역할 | Rank | 책임 |\n|---|---|---|\n| **Master** | 0 | - LLMEngine과 Scheduler 실행 <br> - 요청 수신 및 배치 구성 <br> - Workers에게 실행 명령(`run`, `exit`) 직렬화 및 전송 <br> - Shared Memory 생성 (초기화) |\n| **Workers** | 1 ~ N-1 | - Master의 명령을 대기(Block) <br> - 명령 수신 시 자체 GPU에서 Forward Pass 실행 <br> - 결과를 Shared Memory 또는 NCCL을 통해 Master에 반환 |\n\n## 🔄 초기화 및 실행 루프\n\n```\n[시스템 초기화]\n     │\n     ▼\n┌─────────────────────────────────────────────────────────────────┐\n│ Master (Rank 0) & Workers (Rank 1..N) 병렬 실행               │\n│  1. NCCL Process Group 초기화 (모든 Rank)                     │\n│  2. 각 Rank가 자신의 CUDA Device 설정                         │\n│  3. Master가 Shared Memory 생성 (create)                      │\n│  4. Workers가 Shared Memory에 연결 (attach)                    │\n└─────────────────────────────────────────────────────────────────┘\n     │\n     ▼\n[실행 루프]\n┌─────────────────────────────────────────────────────────────────┐\n│ Master: 새 요청 처리 → Scheduler로 배치 구성                  │\n│   │                                                           │\n│   ├─► (직렬화) 명령 + 데이터 → Shared Memory에 기록            │\n│   └─► Workers에 이벤트 신호 전송 (Event Signal)               │\n└─────────────────────────────────────────────────────────────────┘\n     │\n     ▼\n┌─────────────────────────────────────────────────────────────────┐\n│ Workers: 이벤트 대기(Block) → 해제 → Shared Memory 읽기       │\n│   └─► 명령 실행 (Forward Pass) → NCCL로 결과 동기화           │\n└─────────────────────────────────────────────────────────────────┘\n     │\n     ▼\n[Master: 결과 수집 및 응답 생성 → 클라이언트 반환]\n```\n\n> 💡 **동기화 장벽(Synchronization Barrier)**: 모든 Rank는 `torch.distributed.barrier()`를 통해 초기화 완료 시점을 동기화하여, Master가 Workers보다 먼저 실행되는 레이스 컨디션(Race Condition)을 방지합니다.\n\n## 🔗 관련 관계\n\n- **PREREQUISITES**: [`atomic.tensor_parallelism`](tensor_parallelism.md)\n- **PREREQUISITE_OF**: [`composite.distributed_serving`](../02_composite/distributed_serving_system.md)\n- **SYNERGY WITH**: [`atomic.shared_memory_ipc`](shared_memory_ipc.md) (명령 전달 채널)",

      "title": "Master-Worker Execution Pattern (마스터-워커 실행 패턴)",

    "body": "# Memory Pool (메모리 풀)\n\n## 📌 개념 정의\n\n**Memory Pool**은 GPU의 HBM(High Bandwidth Memory)을 시스템 부팅 시 **미리 할당(Pre-allocate)** 해두고, 이를 **동일한 크기의 블록(Block)들로 구성된 연속된 풀(Pool)**로 추상화하는 기법입니다.\n\n- vLLM은 `torch.cuda` 또는 `cudaMalloc`을 통해 전체 GPU 메모리의 85~95%를 하나의 큰 텐서(또는 버퍼)로 예약합니다.\n- 이 예약된 메모리 공간을 **고정 크기(예: 16 tokens)** 의 블록들로 나누어 관리합니다.\n- 이후 모든 KV Cache 할당 요청은 이 풀에서 블록을 꺼내어 사용하고, 해제 시 다시 풀로 반환합니다.\n\n### 왜 Memory Pool이 필요한가?\n\n| 구분 | 기존 방식 (동적 할당) | Memory Pool 방식 |\n|---|---|---|\n| **할당 타이밍** | Sequence가 들어올 때마다 `cudaMalloc` 호출 | 시스템 시작 시 한 번만 `cudaMalloc` 호출 |\n| **메모리 단편화** | 외부 단편화 심각 (조각 발생) | **외부 단편화 제로 (Zero)** (모든 블록 동일 크기) |\n| **할당 속도** | 느림 (커널 호출 + 메모리 맵핑) | **매우 빠름** (포인터 연산만으로 할당) |\n| **메모리 활용률** | 50~70% | **~100%** |\n\n> 💡 **핵심 통찰**: Memory Pool을 사용하면 런타임에 `cudaMalloc`/`cudaFree`를 **단 한 번도 호출하지 않습니다**. 모든 메모리 관리는 사용자 공간(User Space)에서 포인터 산술(Pointer Arithmetic)과 Free List 관리로 처리됩니다. 이는 GPU 메모리 할당의 병목을 완전히 제거합니다.\n\n---\n\n## 🧱 Memory Pool의 내부 구조\n\n### 1. 풀 초기화 (Pool Initialization)\n\n```python\n# 개념적 Python 코드 (실제 구현은 PyTorch/CUDA)\nclass MemoryPool:\n    def __init__(self, total_memory_gb: float, block_size_tokens: int):\n        self.block_size = block_size_tokens  # 예: 16\n        self.num_blocks = total_memory_gb // block_size_tokens\n        \n        # GPU 메모리를 연속된 하나의 큰 텐서로 사전 할당\n        self.pool_tensor = torch.empty(\n            (self.num_blocks, block_size_tokens, hidden_dim), \n            dtype=torch.float16, device='cuda'\n        )\n        \n        # Free List: 초기에는 모든 블록이 사용 가능\n        self.free_list = list(range(self.num_blocks))\n        self.allocated_count = 0\n```\n\n### 2. 풀의 물리적 레이아웃 (Physical Layout)\n\nMemory Pool은 GPU 메모리 상에 **연속된(Contiguous) 가상 주소 공간**을 차지하지만, 논리적으로는 동일한 크기의 슬롯(Slot)들로 분할됩니다.\n\n```\nGPU HBM 메모리 주소 공간 (가상)\n┌─────────────────────────────────────────────────────────────────────────┐\n│  Block 0  │  Block 1  │  Block 2  │  Block 3  │ ... │  Block N-1  │\n│ (16 tok)  │ (16 tok)  │ (16 tok)  │ (16 tok)  │     │  (16 tok)   │\n└─────────────────────────────────────────────────────────────────────────┘\n│<─────────────────────── Memory Pool (Pre-allocated) ─────────────────>│\n```\n\n### 3. 블록 할당 (Block Allocation)\n\nBlock Allocator가 블록을 요청하면, Memory Pool은 Free List에서 **하나의 블록 ID를 반환**하고 해당 ID를 Free List에서 제거합니다.\n\n```python\ndef allocate_block(self) -> int:\n    if len(self.free_list) == 0:\n        raise OutOfMemoryError(\"Memory Pool is full!\")\n    \n    block_id = self.free_list.pop()  # Free List에서 하나 꺼냄\n    self.allocated_count += 1\n    return block_id  # 물리적 블록 ID 반환\n```\n\n### 4. 블록 해제 (Block Deallocation)\n\nSequence가 종료되어 블록이 더 이상 필요 없어지면, Memory Pool은 해당 블록 ID를 Free List에 다시 추가합니다.\n\n```python\ndef free_block(self, block_id: int) -> None:\n    self.free_list.append(block_id)  # Free List에 다시 추가\n    self.allocated_count -= 1\n```\n\n> 🚀 **성능 이점**: 이 모든 작업은 **CPU 연산만으로 처리**되며, GPU 커널 호출이나 메모리 복사가 전혀 발생하지 않습니다. 따라서 메모리 할당/해제가 **거의 제로 오버헤드(Zero Overhead)** 에 가깝습니다.\n\n---\n\n## 🔗 Module 5 내 다른 개념과의 관계\n\nMemory Pool은 Module 5의 다른 원자적 개념들을 위한 **물리적 기반(Physical Foundation)** 입니다.\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                      Memory Pool                                │\n│  (GPU HBM을 고정 블록으로 추상화)                               │\n└─────────────────────────────────────────────────────────────────┘\n                              │\n                              ▼ (할당/해제 요청)\n┌─────────────────────────────────────────────────────────────────┐\n│                    Block Allocator                              │\n│  (First-Fit / Best-Fit 정책으로 블록 할당 전략 구현)             │\n└─────────────────────────────────────────────────────────────────┘\n                              │\n                              ▼ (메모리 부족 시)\n┌─────────────────────────────────────────────────────────────────┐\n│                     Swap Manager                                │\n│  (Memory Pool이 가득 차면, 블록을 CPU 메모리로 스왑아웃)        │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n### 의존성 흐름\n\n| 개념 | Memory Pool과의 관계 |\n|---|---|\n| **[`atomic.block_allocator`](block_allocator.md)** | Memory Pool의 Free List를 조작하여 블록을 할당/해제하는 **전략(Strategy)** |\n| **[`atomic.swap_manager`](swap_manager.md)** | Memory Pool이 가득 찼을 때, 일부 블록을 CPU로 내보내고(Evict) Free List를 확보하는 **안전장치(Safety Net)** |\n| **[`composite.block_manager`](../02_composite/block_manager.md)** | Memory Pool을 포함하여 위 모든 컴포넌트를 **통합 운영**하는 최상위 관리자 |\n\n---\n\n## 📊 Memory Pool 크기 결정 (Capacity Planning)\n\nMemory Pool의 크기(`num_blocks`)는 다음 요소를 고려하여 결정됩니다.\n\n| 요소 | 설명 | 권장 값 |\n|---|---|---|\n| **모델 가중치 (Weights)** | 모델 파라미터를 저장하는 데 필요한 메모리 (예: Llama 70B ≈ 140GB) | 고정값 |\n| **KV Cache 최대 사용량** | 동시에 처리할 최대 Sequence 수 × 평균 길이 × 레이어 수 × head_dim | 워크로드 기반 예측 |\n| **안전 마진 (Safety Margin)** | 예기치 않은 메모리 요청(Activation, 임시 버퍼)을 위한 여유분 | **전체 GPU 메모리의 5~10%** |\n| **CUDA Context 오버헤드** | CUDA 드라이버 및 커널 실행에 필요한 예약 공간 | 보통 1~2GB |\n\n**공식 (개념적)**:\n\n```\npool_size = (total_gpu_memory - model_weights - safety_margin) // block_size\n```\n\n---\n\n## ⚠️ Memory Pool의 한계 (Trade-offs)\n\n| 장점 | 단점 / 고려사항 |\n|---|---|\n| 외부 단편화 제거 (Near-Zero) | **내부 단편화(Internal Fragmentation)** 발생 가능 (블록의 마지막 슬롯이 채워지지 않을 경우) |\n| 할당/해제 속도 극대화 | 블록 크기(`block_size`)가 너무 작으면 Free List 관리 오버헤드 증가 |\n| 메모리 활용률 100% 달성 | 블록 크기가 너무 크면 내부 단편화 심화 (예: 32 tokens 블록에 1 token만 사용) |\n| 시스템 안정성 향상 | 풀 크기를 초과하는 요청 발생 시 Swap Manager에 의존해야 함 (CPU 스왑 지연 발생) |\n\n> 💡 **최적의 블록 크기(Block Size)**: vLLM은 보통 **16 또는 32 tokens**를 기본 블록 크기로 사용합니다. 이는 내부 단편화를 최소화하면서도 Free List 관리를 효율적으로 유지할 수 있는 경험적(Heuristic) 값입니다.\n\n---\n\n## 📝 Brick-by-Brick 학습 관점\n\nMemory Pool은 지금까지 학습한 개념 중 **\"시스템을 실제로 운영하기 위한 첫 번째 실용적 인프라\"**입니다.\n\n```\n[Module 1] KV Cache 존재 인지\n     │\n     ▼\n[Module 2] 연속 할당의 한계(단편화) 인지 → \"메모리를 어떻게 조각 없이 관리할까?\"\n     │\n     ▼\n[Module 3] Continuous Batching (계산 효율) → \"GPU를 어떻게 쉬지 않게 할까?\"\n     │\n     ▼\n[Module 4] PagedAttention (논리-물리 분리) → \"주소를 어떻게 변환할까?\"\n     │\n     ▼\n[Module 5 - Memory Pool] ★★★★★\n     → \"GPU 메모리를 어떻게 미리 준비해두고, 빠르게 할당/해제할까?\"\n     → 이 개념이 없으면 Block Allocator와 Swap Manager는 동작할 기반이 없음.\n     → **실제 vLLM 시스템의 물리적 기반(Physical Foundation)**\n     │\n     ▼\n[Module 5 - Block Allocator] 할당 전략 구현\n     │\n     ▼\n[Module 5 - Swap Manager] 메모리 부족 시 대비\n```\n\n> 💡 **최종 인사이트**: Memory Pool은 vLLM의 **\"창고(Warehouse)\"**와 같습니다. 시스템이 켜지면 모든 GPU 메모리를 정리 정돈하여 동일한 크기의 상자(블록)들로 채워두고, 필요할 때마다 상자를 꺼내고 반납하는 방식입니다. 이 창고 덕분에 vLLM은 메모리 할당/해제에서 발생하는 병목을 완전히 제거하고, 최대 23배의 처리량 향상을 달성할 수 있습니다.\n이 개념은 Module 5의 **가장 기초가 되는 원자적 개념**으로, GPU HBM을 고정 크기 블록 단위의 풀(Pool)로 추상화하여 **외부 단편화를 원천 차단**하고, PagedAttention이 블록을 할당/해제할 수 있는 **물리적 기반(Substrate)** 을 제공합니다.\n\n## ⚙️ 핵심 동작\n- **블록 프리 리스트**: 사용 가능한 블록을 리스트로 관리.\n- **버퍼 재활용**: 사용이 끝난 블록을 즉시 풀에 반환.\n- **동시 접근**: 락‑프리 알고리즘으로 다중 스레드 안전성을 보장.\n1. **초기화** – 지정된 블록 수와 크기로 pool을 생성.\n2. **할당** – `request(size)` → 가장 작은 충분한 블록 반환.\n3. **해제** – `release(block)` → 블록을 pool에 반환, 재사용 대기.\n    \n## 🔗 관련 관계\n- **PREREQUISITES**: [`continuous_batching`](continuous_batching.md), [`kv_cache`](kv_cache.md) (기본 KV 캐시 메모리)\n- **PREREQUISITE_OF**: [`max_batch_size`](max_batch_size.md), [`block_allocator`](block_allocator.md) (블록 할당기), [`swap_manager`](swap_manager.md) (스와핑 관리자)",

    "body": "# NCCL Communicator (NCCL 통신자)\n\n## 📌 개념 정의\n\n**NCCL (NVIDIA Collective Communications Library)** 은 NVIDIA GPU 간 고속 집단 통신(Collective Communication)을 제공하는 라이브러리입니다. \nTensor Parallelism 환경에서 각 GPU가 계산한 **부분 결과(Partial Results)** 를 하나로 합치거나(All-Reduce), 데이터를 모든 GPU에 동시에 전송(Broadcast)하는 역할을 담당합니다.\n\n## ⚙️ 주요 집단 통신(Primitives) 연산\n\n| 연산 | 설명 | TP에서의 활용 |\n|---|---|---|\n| **All-Reduce** | 모든 GPU의 데이터를 합산(Sum/Avg)하여 모든 GPU에 동일한 결과를 반환 | Linear 레이어 Forward Pass의 출력 동기화 |\n| **Broadcast** | 한 GPU(Rank 0)의 데이터를 모든 다른 GPU로 복사 | Master가 Scheduler 명령을 Workers에 전파 |\n| **All-Gather** | 각 GPU의 데이터를 모아서 모든 GPU가 전체 데이터를 보유 | KV Cache 블록 공유 정보 동기화 |\n\n## 🔧 PyTorch / vLLM에서의 구현\n\n```python\n# PyTorch 분산 패키지를 통한 NCCL 사용 예시\nimport torch.distributed as dist\n\n# 1. Process Group 초기화 (NCCL 백엔드)\ndist.init_process_group(backend='nccl', init_method='env://')\n\n# 2. All-Reduce 실행 (텐서 동기화)\ntensor = torch.randn(1024, device='cuda')\ndist.all_reduce(tensor, op=dist.ReduceOp.SUM)\n# 이제 tensor는 모든 GPU의 합계를 포함",

    "path": "concepts/03_atomic/paged_kv_cache.md",
    "group": "atomic",
    "body": "# Paged KV Cache (페이지드 KV 캐시)\n\n## 📌 개념 정의\n\n**Paged KV Cache**는 기존의 연속된(Contiguous) KV Cache 할당 방식이 초래하는 **외부 단편화(External Fragmentation)** 문제를 해결하기 위해, KV Cache를 **고정 크기(Fixed-Size)의 블록(Block)** 단위로 분할하여 GPU 메모리에 불연속적(Non-Contiguous)으로 저장하는 PagedAttention의 핵심 자료구조입니다.\n\n- 각 블록은 동일한 크기(예: `BLOCK_SIZE = 16 tokens`)를 가지며, 하나의 블록에는 16개 토큰의 Key와 Value 텐서가 저장됩니다.\n- Sequence의 길이가 증가하면 필요에 따라 새로운 블록을 동적으로 할당하여 추가합니다.\n- Sequence가 종료되면 해당 블록들을 즉시 메모리 풀로 반환하여 다른 Sequence가 재사용할 수 있습니다.\n\n---\n\n## ❗ 왜 Paged KV Cache가 필요한가? (The Problem)\n\n### 기존 Static KV Cache의 한계 (연속 할당)\n\n- 각 Sequence는 자신의 KV Cache를 위해 **연속된 메모리 블록**을 할당받습니다.\n- Sequence가 종료되어 메모리를 해제하면, 그 공간은 **조각(Fragment)** 으로 남습니다.\n- 시간이 지남에 따라 메모리는 수많은 작은 조각들로 분할되고, **실제로는 충분한 총 메모리가 있음에도 불구하고** 새로운 Sequence가 필요한 연속 공간을 할당받지 못해 **OOM(Out Of Memory)** 오류가 발생합니다.\n\n```\nGPU 메모리 상태 (연속 할당):\n─────────────────────────────────────────────\n[ Seq A (1024) ] [ Free (400) ] [ Seq B (512) ]\n                  ↑ 800 tokens 요청이 들어오면?\n                  → 연속 공간이 400 tokens 밖에 없어 할당 불가!\n                  → OOM 발생 (실제 총 Free는 1400 tokens)\n```\n\n### Paged KV Cache의 해결책 (The Solution)\n\n- 모든 블록을 **동일한 크기(예: 16 tokens)** 로 고정합니다.\n- Sequence가 더 이상 하나의 큰 연속 공간을 요구하지 않고, **필요한 개수의 블록**을 할당받습니다.\n- 블록 크기가 동일하므로, 해제된 블록은 **조각(Fragment) 없이** 즉시 다른 Sequence가 재사용할 수 있습니다.\n- 결과적으로 **외부 단편화가 거의 제로(Near-Zero)** 에 수렴하고, 메모리 활용률이 50~70%에서 **~100%** 로 향상됩니다.\n\n---\n\n## 🧱 Paged KV Cache의 내부 구조\n\n### 1. 블록 단위 물리적 저장 (Block-based Physical Storage)\n\nPaged KV Cache는 GPU 메모리 상에 다음과 같이 배치됩니다:\n\n```\nGPU HBM 메모리 (PagedAttention):\n┌──────────┬──────────┬──────────┬──────────┬──────────┬──────────┐\n│ Block 7  │ Block 3  │ Block 15 │ Block 22 │ Block 8  │ Block 1  │\n│ (Seq A)  │ (Seq A)  │ (Seq B)  │ (Seq A)  │ (Seq C)  │ (Seq B)  │\n└──────────┴──────────┴──────────┴──────────┴──────────┴──────────┘\n   ↑ 각 블록은 16 tokens의 KV를 저장, 물리적 주소는 불연속적\n```\n\n- 각 블록은 **고정된 토큰 수**(`BLOCK_SIZE`)의 Key와 Value 텐서를 저장합니다.\n- 블록 크기는 보통 16 또는 32로 설정되며, 이는 내부 단편화(Internal Fragmentation)와 관리 오버헤드 간의 균형을 최적화합니다.\n\n### 2. 블록 테이블을 통한 논리-물리 매핑\n\nPaged KV Cache는 그 자체로는 논리적 연속성을 제공하지 않습니다.  \n이를 위해 **Block Table(블록 테이블)** 이 각 Sequence의 논리적 블록 번호를 물리적 블록 ID로 매핑합니다.\n\n```\nSequence A의 Block Table:\n┌─────────────────┬──────────────────┐\n│ Logical Block 0 │ Physical Block 7 │\n│ Logical Block 1 │ Physical Block 3 │\n│ Logical Block 2 │ Physical Block 22│\n└─────────────────┴──────────────────┘\n```\n\n> 💡 **핵심**: Paged KV Cache는 **물리적 저장소(Physical Storage)**의 역할만 담당하며, 논리적 연속성은 [`atomic.block_table`](block_table.md)이 제공합니다. 두 개념은 분리되어 있지만, PagedAttention이 동작하기 위해서는 반드시 함께 사용됩니다.\n\n---\n\n## 📊 성능 영향 (Performance Impact)\n\n| 지표 | Static KV Cache (연속 할당) | Paged KV Cache (블록 할당) |\n|---|---|---|\n| **외부 단편화** | 심각 (30~50% 낭비) | **거의 제로 (Near-Zero)** |\n| **메모리 활용률** | 50~70% | **~100%** |\n| **OOM 발생 빈도** | 빈번 | **거의 없음** |\n| **할당 속도** | 느림 (cudaMalloc 호출) | **매우 빠름** (Free List에서 Pop) |\n| **처리량 (Throughput)** | 제한적 | **10~23배 향상** |\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITES**: [`atomic.kv_cache`](kv_cache.md) (기본 KV Cache 개념을 확장)\n- **COMPOSES_INTO**: [`composite.paged_attention_manager`](../02_composite/paged_attention_manager.md) (Module 04)\n- **SYNERGY WITH**:\n  - [`atomic.block_table`](block_table.md) (논리-물리 주소 매핑)\n  - [`atomic.slot_mapping`](slot_mapping.md) (토큰 위치 → 블록 내 슬롯 변환)\n  - [`atomic.memory_pool`](memory_pool.md) (Module 05, 블록을 할당할 물리적 메모리 풀)\n\n---\n\n## 📝 Brick-by-Brick 관점에서의 위치\n\nPaged KV Cache는 **Module 02 (Static KV Cache)의 한계를 인지**하고, **Module 04 (PagedAttention)의 물리적 기반**을 제공하는 핵심 원자 개념입니다.\n\n```\n[Module 01] kv_cache (기본 개념)\n     │\n     ▼\n[Module 02] static_kv_cache (연속 할당의 한계 체험)\n     │\n     ▼\n[Module 04] paged_kv_cache ★★★★★\n     → \"연속성이 아닌 블록 단위로 메모리를 관리하자!\"\n     → 외부 단편화 제거, 메모리 활용률 극대화\n     → PagedAttention의 물리적 저장소 역할\n     │\n     ▼\n[Module 04] block_table, slot_mapping (논리-물리 변환)\n```\n\n> 💡 **핵심 인사이트**: Paged KV Cache는 vLLM의 가장 혁신적인 아이디어인 PagedAttention을 가능하게 하는 **물리적 데이터 구조**입니다. 연속 할당의 단점을 극복하고, 메모리 단편화를 완전히 제거함으로써 vLLM이 10~23배의 처리량 향상을 달성할 수 있게 합니다.\n```",
    "frontmatter": {

    "type": "AtomicConcept",
    "path": "concepts/03_atomic/prefill_phase.md",
    "group": "atomic",
    "body": "# Prefill Phase (프리필 단계)\n\n## 📌 개념 정의\n\n**Prefill Phase**(또는 Prompt Processing Phase)는 사용자가 입력한 $N$개의 프롬프트 토큰 전체를 LLM 모델에 한 번에 주입하여 첫 번째 출력 토큰(First Token)을 생성하는 단계입니다.\n\n이 단계는 다음과 같은 기술적 특징을 가집니다:\n1. **Parallel Execution**: $N$개 토큰에 대한 행렬 곱 연산을 GPU Tensor Core에서 한 번에 병렬 처리함.\n2. **Compute-Bound Operation**: Arithmetic Intensity(FLOP/Byte)가 높아 GPU 연산 성능(TFLOPS)이 주 병목 요인임.\n3. **KV Cache Initialization**: $N$개 토큰 각각에 해당하는 Key, Value 벡터들을 계산하여 최초 KV 캐시 블록에 할당 및 대치함.\n\n---\n\n## 📐 연산 차원 (Tensor Shape)\n\n- **Input Tensor Shape**: `[Batch Size, Prompt Length, Hidden Size]`\n- **Attention Map Matrix**: `[Batch Size, Num Heads, Prompt Length, Prompt Length]`\n- **Output KV Cache Shape**: `[Batch Size, Num Heads, Prompt Length, Head Dim]`\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITES**:\n  - [`inference_only`](inference_only.md)\n- **PREREQUISITE_OF**:\n  - [`decode_phase`](decode_phase.md)\n  - [`inference_model`](../02_composite/inference_model.md)",

    "group": "atomic",
    "body": "# Prefix Cache (프리픽스 캐시)\n\n## 📌 개념 정의\n**Prefix Cache**는 동일한 입력 프리픽스(예: 시스템 프롬프트, 첫 N 토큰)를 **핵심 연산 결과**(KV, hidden states\n등)와 함께 메모리에 저장하고, 이후 요청이 동일 프리픽스를 가질 경우 재사용한다.\n- **재사용 범위**: 동일 프리픽스·모델·배치 설정 조건 하에 재활용.\n- **효과**: 프리패딩 연산을 한 번만 수행 → GPU 사용량·레이트 감소.\n\n## ⚙️ 핵심 흐름\n1. **프리픽스 추출** – 요청에서 첫 `P` 토큰을 식별.\n2. **캐시 탐색** – `hash(prefix)` 으로 기존 캐시 존재 여부 확인.\n3. **캐시 히트** → 저장된 KV/hidden 상태를 바로 로드.\n4. **캐시 미스** → 프리패딩 수행 후 결과를 캐시에 저장.\n\n## 🔗 관련 관계\n- **PREREQUISITES**: [`kv_cache`](kv_cache.md)\n- **COMPOSED_OF**: [`cache_hit_detection`](cache_hit_detection.md), [`caching_strategy`](../02_composite/caching_strategy.md)",

    "group": "atomic",
    "body": "# Token Sampling Strategies (토큰 샘플링 기법)\n\n## 📌 개념 정의\n\n**Sampling** 기법은 LLM의 최종 Linear Head를 거쳐 나온 Logit 텐서에서 다음 생성될 단어(Token ID)를 결정하는 알고리즘입니다.\n\n### 핵심 제어 파라미터:\n1. **Temperature ($T$)**: 확률 분포의 무작위성(Randomness) 조율 ($T \\to 0$일수록 Greedy Search)\n2. **Top-k Sampling**: Logit 상위 $k$개 토큰 후보만 남기고 나머지 제외\n3. **Top-p (Nucleus) Sampling**: 누적 확률 분포가 $p$에 도달할 때까지 상위 토큰들만 동적으로 선별\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITE_OF**:\n  - [`autoregressive_loop`](../02_composite/autoregressive_loop.md)",

    "body": "# Sequence Length Budget (시퀀스 예산 정책)\n\n## 📌 개념 정의\n\n**Sequence Length Budget**은 추론 요청 생성 시 `max_tokens` 또는 `max_context_length` 값을 상한선으로 설정하여, 정적 KV 캐시 버퍼가 허용 범위 내에서만 인덱싱되도록 제어하는 안전 규칙(Budget Rule)입니다.\n\n현재 시퀀스 길이가 할당된 예산을 초과하면 캐시 오버플로우 예외를 발생시키거나 요청을 거부(Reject)합니다.\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITE_OF**:\n  - [`static_cache_manager`](../02_composite/static_cache_manager.md)",

    "path": "concepts/03_atomic/shared_memory_ipc.md",
    "group": "atomic",
    "body": "# Shared Memory IPC (공유 메모리 프로세스 간 통신)\n\n## 📌 개념 정의\n\n**Shared Memory IPC**는 Master 프로세스(Rank 0)와 Worker 프로세스(Rank 1..N) 간에 **명령(Command)과 데이터를 주고받기 위한 고속 통신 채널**입니다.\n\nLinux 환경에서는 **POSIX Shared Memory**(`/dev/shm`)를, Windows 환경에서는 **Named Memory Mapping**을 사용합니다. nano-vLLM은 기본적으로 Linux를 가정하며, `\"nanovllm\"`이라는 이름의 공유 메모리 객체를 생성합니다.\n\n## 📐 프로토콜 (Protocol)\n\n공유 메모리는 다음과 같은 간단한 **Length-Prefixed Serialization Protocol**을 사용합니다:\n\n```\nShared Memory 레이아웃 (기본 크기: 1 MB = 2^20 bytes):\n┌──────────────┬──────────────────────────────────────────┐\n│ Bytes 0-3    │ Bytes 4 ~ (4 + message_length)          │\n│ Message 길이 │ Pickle 직렬화된 데이터                  │\n│ (4 bytes)    │ [method_name, *args, **kwargs]          │\n└──────────────┴──────────────────────────────────────────┘\n```\n\n## 🔄 데이터 흐름 (Data Flow)\n\n| 단계 | 수행 주체 | 동작 |\n|---|---|---|\n| **1. 쓰기 (Write)** | Master (Rank 0) | 1. `(method, args, kwargs)`를 `pickle.dumps()`로 직렬화 <br> 2. 길이(4 bytes)와 직렬화 데이터를 공유 메모리에 기록 <br> 3. Workers에 **Event Signal** (또는 Condition Variable) 전송 |\n| **2. 읽기 (Read)** | Workers (Rank 1..N) | 1. Event Signal 대기(Block) <br> 2. 공유 메모리에서 길이 읽기 → 데이터 읽기 <br> 3. `pickle.loads()`로 역직렬화하여 명령어와 인자 복원 |\n\n## 📦 지원 명령어 (Supported Commands)\n\n| Command | 인자 | 설명 |\n|---|---|---|\n| `\"run\"` | `batch_data` (Token IDs, Metadata) | 주어진 배치에 대해 모델 Forward Pass 실행 |\n| `\"exit\"` | 없음 | Worker 프로세스를 안전하게 종료하고 자원 정리 |\n\n> 💡 **설계 이점**: TCP/IP 소켓 대신 공유 메모리를 사용하면 **마이크로초(μs) 수준의 지연 시간**으로 명령을 전달할 수 있어, 매 Iteration마다 발생하는 오버헤드를 최소화합니다.\n\n## 🔗 관련 관계\n\n- **PREREQUISITES**: [`atomic.master_worker`](master_worker.md)\n- **PREREQUISITE_OF**: [`composite.distributed_serving`](../02_composite/distributed_serving_system.md)\n- **SYNERGY WITH**: [`atomic.nccl_communicator`](nccl_communicator.md) (명령 전달은 IPC, 텐서 동기화는 NCCL)",

    "id": "atomic.slot_mapping",
    "title": "Slot Mapping (슬롯 매핑)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/slot_mapping.md",
    "group": "atomic",
    "body": "# Slot Mapping (슬롯 매핑)\n\n## 📌 개념 정의\n\n**Slot Mapping**은 PagedAttention에서 **특정 토큰의 Key/Value 텐서가 GPU 메모리의 어느 물리적 블록(Physical Block)의 몇 번째 슬롯(Slot)에 저장되어 있는지**를 계산하는 핵심 주소 변환 공식입니다.\n\nPaged KV Cache는 각 Sequence의 KV 텐서를 여러 개의 불연속적인 물리적 블록에 분산 저장합니다. Attention 커널이 특정 토큰 위치(예: `token_position = 25`)의 KV를 읽으려면, 해당 토큰이 저장된 **물리적 블록 ID**와 **블록 내부의 오프셋(슬롯)**을 알아야 합니다. 이때 사용되는 것이 바로 Slot Mapping입니다.\n\n---\n\n## 🧮 매핑 공식 (Mapping Formula)\n\nSlot Mapping은 다음의 간단한 정수 연산(산술/논리 연산)으로 구성됩니다:\n\n```\nBLOCK_SIZE = 16 (고정, 예시)\n\n1. 논리적 블록 ID 계산:\n   logical_block_id = token_position // BLOCK_SIZE\n\n2. 물리적 블록 ID 조회:\n   physical_block_id = block_table[logical_block_id]\n\n3. 블록 내 슬롯 인덱스 계산:\n   slot_index = token_position % BLOCK_SIZE\n```\n\n### 📊 예시 (Example)\n\n**가정**: `BLOCK_SIZE = 16`, Sequence A의 Block Table이 다음과 같다고 가정합니다.\n\n| Logical Block ID | Physical Block ID |\n| :---: | :---: |\n| 0 | 7 |\n| 1 | 3 |\n| 2 | 15 |\n\n**`token_position = 25`인 토큰의 KV를 찾는 과정:**\n\n1. **논리적 블록 ID**: `25 // 16 = 1`\n2. **물리적 블록 ID**: Block Table[1] → **`3`**\n3. **슬롯 인덱스**: `25 % 16 = 9`\n\n> 🎯 **결과**: `token_position = 25`의 KV는 **물리적 블록 3**의 **슬롯 9**에 저장되어 있습니다.\n\n---\n\n## ⚙️ Attention 커널의 메모리 주소 계산\n\n실제 GPU 커널(CUDA/Triton)은 위에서 계산된 `physical_block_id`와 `slot_index`를 사용하여 다음과 같이 메모리 오프셋을 계산하고 KV 텐서를 읽어옵니다.\n\n```cpp\n// 의사 코드 (CUDA 커널 내부)\n// key_cache: [num_physical_blocks, BLOCK_SIZE, num_heads, head_dim] 형태의 텐서\n// head_idx: 현재 계산 중인 Head의 인덱스\n\n// 1. 블록의 시작 주소 계산\nvoid* block_ptr = key_cache[physical_block_id];\n\n// 2. 슬롯(토큰)의 시작 주소 계산\n//    각 슬롯은 (num_heads * head_dim) 만큼의 크기를 가짐\nint slot_offset = slot_index * num_heads * head_dim;\n\n// 3. 특정 Head의 Key 벡터 주소 계산\nint head_offset = head_idx * head_dim;\n\n// 4. 최종 메모리 주소\nvoid* key_ptr = block_ptr + slot_offset + head_offset;\n```\n\n> 💡 **연산 비용**: Slot Mapping은 단순한 **정수 나눗셈(Division)과 나머지 연산(Modulo), 그리고 배열 참조(Array Lookup)**에 불과합니다. 따라서 Attention 연산(GEMV/GEMM)에 비해 **무시할 수 있을 정도의 오버헤드(마이크로초 미만)** 만을 발생시킵니다.\n\n---\n\n## ⚠️ 왜 Slot Mapping이 필수적인가?\n\n| 구분 | Static KV Cache (연속 할당) | PagedAttention (Slot Mapping) |\n| :--- | :--- | :--- |\n| **메모리 접근** | `base_address + token_position * head_dim` (단순 포인터 연산) | `block_table[token // BLOCK_SIZE] * BLOCK_SIZE + token % BLOCK_SIZE` (블록 조회 + 슬롯 계산) |\n| **단편화** | 심각한 외부 단편화 발생 | 단편화 제로 (Zero) |\n| **주소 변환 비용** | 없음 (직접 접근) | **매우 작음** (단순 연산) |\n| **처리량 효과** | 낮음 (OOM 위험) | **10~23배 향상** (단편화 제거 이득 >>> 주소 변환 비용) |\n\n> 💡 **핵심 트레이드오프**: Slot Mapping은 단순한 정수 연산(수 나노초~마이크로초)을 추가하는 대신, 메모리 단편화를 완전히 제거하여 수십 배의 처리량 향상을 얻습니다. 이는 **지불할 가치가 충분히 큰 비용(Totally Worthwhile Trade-off)**입니다.\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITES**:\n  - [`atomic.paged_kv_cache`](paged_kv_cache.md) (물리적 블록이 실제로 존재해야 함)\n  - [`atomic.block_table`](block_table.md) (논리-물리 매핑 정보가 필요함)\n- **COMPOSES_INTO**: [`composite.paged_attention_manager`](../02_composite/paged_attention_manager.md) (Module 04)\n- **SYNERGY WITH**: [`atomic.paged_kv_cache`](paged_kv_cache.md), [`atomic.block_table`](block_table.md) (이 세 가지가 PagedAttention의 논리-물리 주소 변환 계층을 완성)\n\n---\n\n## 📝 Brick-by-Brick 관점에서의 위치\n\nSlot Mapping은 PagedAttention의 **\"주소 계산기(Address Calculator)\"** 역할을 합니다.\n\n```\n[Module 01] kv_cache (기본 KV 저장 개념 인지)\n     │\n     ▼\n[Module 02] static_kv_cache (연속 할당의 한계 인지)\n     │\n     ▼\n[Module 04] paged_kv_cache (불연속 블록 저장소 도입)\n     │\n     ▼\n[Module 04] block_table (논리-물리 매핑 정보 도입)\n     │\n     ▼\n[Module 04] slot_mapping ★★★★★\n     → \"token_position을 physical_block_id와 slot_index로 변환하자!\"\n     → Attention 커널이 불연속 메모리를 읽을 수 있게 하는 마지막 퍼즐 조각\n     → 단순한 나눗셈과 나머지 연산으로 O(1) 주소 변환 달성\n     │\n     ▼\n[완성] composite.paged_attention_manager (논리-물리 변환 시스템 완성)\n```\n\n> 💡 **최종 인사이트**: Slot Mapping은 PagedAttention의 **\"마지막 1%의 논리\"**입니다. Paged KV Cache가 \"무엇을\" 저장할지 정의하고, Block Table이 \"어디에\" 있는지 매핑한다면, Slot Mapping은 \"어떻게\" 그 주소를 계산할지 정의합니다. 이 단순한 공식 덕분에 GPU 커널은 메모리 단편화 없이도 빠르게 KV 데이터를 찾을 수 있으며, 이것이 바로 vLLM이 실제 하드웨어에서 놀라운 속도를 낼 수 있는 이유입니다.",

    "id": "atomic.static_kv_cache",
    "title": "Static KV Cache (정적 KV 캐시 버퍼)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/static_kv_cache.md",
    "group": "atomic",
    "body": "# Static KV Cache (정적 KV 캐시 버퍼)\n\n## 📌 개념 정의\n\n**Static KV Cache**는 요청 처리 전, 생성 가능한 최대 토큰 수(`max_seq_len`)에 해당하는 연속적인 메모리 공간을 GPU에 동적으로 확장하지 않고 한 번에 미리 할당(`Pre-allocate`)해 두는 캐싱 방식입니다.\n\n동적 메모리 재할당(Reallocation) 및 메모리 복사 오버헤드를 방지하여 디코드 속도가 안정적이지만, 실제 생성 토큰 수가 적을 경우 메모리 낭비(Internal Fragmentation)가 심하다는 단점이 있습니다.\n\n---\n\n## 📐 텐서 구조 예시\n\n```python\n# 사전 할당 텐서 차원\nkey_buffer = torch.zeros(batch_size, num_heads, max_seq_len, head_dim)\nvalue_buffer = torch.zeros(batch_size, num_heads, max_seq_len, head_dim)\n\n# t번째 토큰 슬라이스 업데이트\nkey_buffer[:, :, current_pos, :] = new_key\nvalue_buffer[:, :, current_pos, :] = new_value\n```\n\n---\n\n## 🔗 관련 관계 (Relationships)\n\n- **PREREQUISITES**:\n  - [`kv_cache`](kv_cache.md) (Module 01)\n- **PREREQUISITE_OF**:\n  - [`static_cache_manager`](../02_composite/static_cache_manager.md)\n  - [`paged_kv_cache`](paged_kv_cache.md) (Module 04 - 한계 극복 대상)",

    "id": "atomic.swap_manager",
    "title": "Swap Manager (스와핑 관리자)",
    "type": "AtomicConcept",

    "group": "atomic",
    "body": "# Swap Manager (스와핑 관리자)\n\n## 📌 개념 정의\n**Swap Manager**는 [`memory_pool`](memory_pool.md)이 메모리 한계에 도달했을 때, **덜 중요한 블록**을 디스크에 스와핑(swap)하고 필요\n시 다시 읽어오는 메커니즘이다.\n- **스와프 스레드**: 백그라운드에서 비동기로 동작.\n- **우선순위 정책**: 오래된·사용 빈도가 낮은 블록을 우선 스와핑.\n\n## ⚙️ 주요 흐름\n1. **점검** – 현재 풀 사용량 > `max_pool_size`?\n2. **선별** – `eviction_priority`에 따라 스와핑 대상 선정.\n3. **스와핑** – 블록을 파일 시스템(또는 SSD)으로 이동, 메모리 풀에 빈 슬롯 확보.\n4. **복구** – 필요 시 `swap_in(block_id)` 로 메모리 복구.\n\n## 🔗 관련 관계\n- **PREREQUISITES**: [`memory_pool`](memory_pool.md), [`block_allocator`](block_allocator.md)\n- **PREREQUISITE_OF**: [`composite.block_manager`](../02_composite/block_manager.md) (블록 추적)",

    "title": "Tensor Parallelism (텐서 병렬성)",
    "type": "AtomicConcept",
    "path": "concepts/03_atomic/tensor_parallelism.md",
    "group": "atomic",
    "body": "# Tensor Parallelism (텐서 병렬성)\n\n## 📌 개념 정의\n\n**Tensor Parallelism (TP)** 은 단일 GPU 메모리에 적재할 수 없는 대형 LLM(예: 70B 파라미터)을 여러 GPU에 분할하여 실행하는 핵심 기술입니다. \n**Megatron-LM**에서 제안된 방식으로, Transformer 레이어 내부의 **Linear(MLP) 레이어와 Attention 레이어의 가중치 텐서를 Column-wise 또는 Row-wise로 분할(Shard)** 합니다.\n\n## 🔄 작동 방식 (Column-wise 예시)\n\n`Y = X * W` (Linear Layer) 연산에서, 가중치 텐서 `W`를 GPU 개수(`TP`)만큼 Column 방향으로 분할합니다.\n\n| 구성 | 설명 |\n|---|---|\n| **입력 (X)** | 모든 GPU에 동일하게 브로드캐스트 (혹은 복제) |\n| **가중치 (W)** | GPU 0: `W[:, 0 : d/tp]`, GPU 1: `W[:, d/tp : 2*d/tp]`, ... |\n| **출력 (Y)** | 각 GPU가 자신의 Shard에 대해 부분 행렬 곱(Partial GEMM) 수행 |\n| **동기화** | Forward Pass 종료 시 **All-Reduce**로 모든 GPU의 부분 합을 집계하여 최종 출력 생성 |\n\n## 📊 메모리 이득\n\n| TP 크기 | 가중치 당 GPU 메모리 사용량 | KV Cache 할당량 |\n|---|---|---|\n| 1 (단일 GPU) | 100% (기준) | 100% |\n| 2 | 50% | 200% (KV Heads도 분할되므로 총 용량 증가) |\n| 4 | 25% | 400% |\n| 8 | 12.5% | 800% |\n\n> 💡 **Trade-off**: TP를 늘리면 GPU 간 통신(All-Reduce) 오버헤드가 증가하므로, 모델 크기와 GPU 수에 맞는 최적의 TP 값을 선택해야 합니다.\n\n## 🔗 관련 관계\n\n- **PREREQUISITES**: [`atomic.inference_only`](inference_only.md)\n- **PREREQUISITE_OF**: [`composite.distributed_serving`](../02_composite/distributed_serving_system.md) (Module 07)\n- **SYNERGY WITH**: [`atomic.nccl_communicator`](nccl_communicator.md) (All-Reduce 구현), [`atomic.distributed_kv`](distributed_kv.md) (KV Heads 분할)",

        const groupColors = {
            atomic: '#38bdf8',
            composite: '#a855f7',
            module: '#22c55e',
            meta: '#eab308',
            other: '#64748b'
        };

        let selectedGroups = new Set(['atomic', 'composite', 'module', 'meta', 'other']);

        const nodeListEl = document.getElementById('node-list');
        const graphContainer = document.getElementById('graph-view');
        const markdownContainer = document.getElementById('markdown-container');
        const resizer = document.getElementById('resizer');
        const contentView = document.getElementById('content-view');
        const mainContainer = document.getElementById('main-container');

        let network = null;

        // ---------- 드래그 리사이즈 로직 ----------
        let isResizing = false;
        let startY = 0;
        let startGraphHeight = 0;

        resizer.addEventListener('mousedown', function(e) {
            isResizing = true;
            startY = e.clientY;
            startGraphHeight = graphContainer.offsetHeight;
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;
            const delta = e.clientY - startY;
            // delta가 양수면 그래프 영역을 줄임 (내림), 음수면 늘림 (올림)
            let newGraphHeight = startGraphHeight + delta;
            // 최소/최대 높이 제한 (전체 높이의 10% ~ 90%)
            const containerHeight = mainContainer.offsetHeight;
            const minH = containerHeight * 0.1;
            const maxH = containerHeight * 0.9;
            if (newGraphHeight < minH) newGraphHeight = minH;
            if (newGraphHeight > maxH) newGraphHeight = maxH;
            graphContainer.style.height = newGraphHeight + 'px';
        });

        document.addEventListener('mouseup', function(e) {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                // 그래프 크기 변경 후 네트워크 재조정 (필요시)
                if (network) {
                    network.redraw();
                }
            }
        });

        // 더블클릭하면 기본 비율(45%)로 복원
        resizer.addEventListener('dblclick', function() {
            const containerHeight = mainContainer.offsetHeight;
            const defaultHeight = containerHeight * 0.45;
            graphContainer.style.height = defaultHeight + 'px';
            if (network) {
                network.redraw();
            }
        });

        // ---------- 그래프 및 사이드바 렌더링 ----------
        function buildGraphData(groups) {
            const filteredNodes = allNodes.filter(n => groups.has(n.group));
            const nodeIds = new Set(filteredNodes.map(n => n.id));
            const filteredEdges = allEdges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target));
            return { nodes: filteredNodes, edges: filteredEdges };
        }

        function renderGraph(groups) {
            const { nodes, edges } = buildGraphData(groups);
            const visNodes = new vis.DataSet(nodes.map(n => ({
                id: n.id,
                label: n.title,
                color: { background: groupColors[n.group] || '#64748b', border: '#ffffff' },
                font: { color: '#ffffff' }
            })));
            const visEdges = new vis.DataSet(edges.map((e, idx) => ({
                id: idx,
                from: e.source,
                to: e.target,
                arrows: 'to',
                color: { color: '#475569' }
            })));
            const data = { nodes: visNodes, edges: visEdges };
            if (network === null) {
                network = new vis.Network(graphContainer, data, {
                    nodes: { shape: 'dot', size: 16, font: { size: 14 } },
                    physics: { stabilization: false, barnesHut: { gravitationalConstant: -3000, springLength: 95 } }
                });
                network.on('click', function(params) {
                    if (params.nodes.length) selectNode(params.nodes[0]);
                });
            } else {
                network.setData(data);
                network.redraw();
            }
        }

        function renderSidebar(groups) {
            const filtered = allNodes.filter(n => groups.has(n.group));
            nodeListEl.innerHTML = '';
            filtered.forEach(node => {
                const item = document.createElement('div');
                item.className = 'node-item';
                item.id = 'sidebar-' + node.id;
                item.innerHTML = `<span>${node.title}</span><span class="badge badge-${node.group}">${node.group}</span>`;
                item.onclick = () => selectNode(node.id);
                nodeListEl.appendChild(item);
            });
        }

        function applyFilters() {
            renderGraph(selectedGroups);
            renderSidebar(selectedGroups);
            // 현재 선택된 노드가 필터에 없으면 초기화
            const active = document.querySelector('.node-item.active');
            if (active) {
                const id = active.id.replace('sidebar-', '');
                const node = allNodes.find(n => n.id === id);
                if (!node || !selectedGroups.has(node.group)) {
                    document.querySelectorAll('.node-item').forEach(el => el.classList.remove('active'));
                    markdownContainer.innerHTML = `<h1>노드를 선택해 주세요</h1><p>좌측 목록 또는 그래프에서 노드를 클릭하면 내용이 표시됩니다.</p>`;
                }
            }
        }

        // 필터 버튼 이벤트 (단일 선택)
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const group = this.dataset.group;
                if (group === 'all') {
                    selectedGroups = new Set(['atomic', 'composite', 'module', 'meta', 'other']);
                    document.querySelectorAll('.filter-btn:not(.all)').forEach(b => b.classList.add('active'));
                    this.classList.add('active');
                } else {
                    selectedGroups = new Set([group]);
                    document.querySelectorAll('.filter-btn:not(.all)').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelector('.filter-btn.all').classList.remove('active');
                }
                applyFilters();
            });
        });

        // 노드 선택 함수 — 브라우징 히스토리(앞으로/뒤로) 지원
        let history = [];
        let historyIndex = -1;
        const backBtn = document.getElementById('btn-back');
        const forwardBtn = document.getElementById('btn-forward');
        const positionEl = document.getElementById('nav-position');

        function updateNavButtons() {
            backBtn.disabled = historyIndex <= 0;
            forwardBtn.disabled = historyIndex >= history.length - 1;
            positionEl.textContent = history.length > 0 ? (historyIndex + 1) + ' / ' + history.length : '';
        }

        function renderNode(nodeId) {
            const node = allNodes.find(n => n.id === nodeId);
            if (!node) return;
            document.querySelectorAll('.node-item').forEach(el => el.classList.remove('active'));
            const active = document.getElementById('sidebar-' + nodeId);
            if (active) active.classList.add('active');

            const parsed = marked.parse(node.body);
            markdownContainer.innerHTML = `
                <div class="meta-tags">
                    <span class="meta-tag">ID: ${node.id}</span>
                    <span class="meta-tag">Type: ${node.type}</span>
                    <span class="meta-tag">Path: ${node.path}</span>
                </div>
                ${parsed}
            `;
            hljs.highlightAll();

            // Resolve a link href relative to the DISPLAYED node's directory.
            // Module files link downward with file-relative paths like
            // "../03_atomic/kv_cache.md"; index links use "concepts/...".
            function resolveNodePath(href, baseNode) {
                if (!href || /^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('/') || href.startsWith('#')) {
                    return href;
                }
                const dir = baseNode.path.includes('/')
                    ? baseNode.path.split('/').slice(0, -1).join('/') : '';
                const joined = dir ? dir + '/' + href : href;
                const parts = [];
                for (const p of joined.split('/')) {
                    if (p === '' || p === '.') continue;
                    if (p === '..') { if (parts.length) parts.pop(); }
                    else parts.push(p);
                }
                return parts.join('/');
            }

            markdownContainer.querySelectorAll('a').forEach(link => {
                const href = link.getAttribute('href');
                if (href && (href.includes('.okf/') || href.includes('.md'))) {
                    link.onclick = (e) => {
                        e.preventDefault();
                        const resolved = resolveNodePath(href, node);
                        const target =
                            allNodes.find(n => n.path === resolved)
                            || allNodes.find(n => resolved && (resolved.includes(n.path) || resolved.includes(n.id)))
                            || allNodes.find(n => href.includes(n.path) || href.includes(n.id));
                        if (target) {
                            selectNode(target.id);
                            if (network) {
                                network.selectNodes([target.id]);
                            }
                        }
                    };
                }
            });
            updateNavButtons();
        }

        // 기록(히스토리)을 남기며 노드 렌더링
        function selectNode(nodeId) {
            const node = allNodes.find(n => n.id === nodeId);
            if (!node) return;
            if (history[historyIndex] === nodeId) {
                renderNode(nodeId);
                return;
            }
            // 현재 위치 이후의 앞으로-기록은 버리고 새 노드를 push
            history = history.slice(0, historyIndex + 1);
            history.push(nodeId);
            historyIndex = history.length - 1;
            renderNode(nodeId);
        }

        function goBack() {
            if (historyIndex > 0) {
                historyIndex -= 1;
                renderNode(history[historyIndex]);
            }
        }

        function goForward() {
            if (historyIndex < history.length - 1) {
                historyIndex += 1;
                renderNode(history[historyIndex]);
            }
        }

        backBtn.addEventListener('click', goBack);
        forwardBtn.addEventListener('click', goForward);
        document.addEventListener('keydown', function(e) {
            if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
            if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goForward(); }
        });

        // 초기 렌더링
        applyFilters();
        // 기본 선택
        const defaultNode = allNodes.find(n => n.id.includes('index') || n.group === 'meta') || allNodes[0];
        if (defaultNode) selectNode(defaultNode.id);

        // 윈도우 리사이즈 시 그래프 높이 조정 (기본 비율 유지)
        window.addEventListener('resize', function() {
            // 사용자가 드래그로 높이를 변경했다면 그대로 두기 위해, 변경된 높이가 없으면 기본 비율로 재조정하지 않음.
            // 그냥 네트워크 redraw만 수행
            if (network) network.redraw();
        });
    </script>
